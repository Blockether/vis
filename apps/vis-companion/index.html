<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#faf3eb" />
    <link rel="icon" type="image/png" href="/vis-logo.png" />
    <title>Vis</title>
    <!--
      The palette, on the first frame the device paints.

      Every palette ships as static CSS and the DEFAULT one doubles as `:root`,
      so an app that learns its theme from JS paints LIGHT paper until it does.
      The module bundle has to load and evaluate first, which on a resume — iOS
      reloads the page whenever it recycled the backgrounded webview — showed a
      white sheet, then the splash, then the real palette. This runs during
      parse instead: one mirrored key (`storage.ts` writes `vis.themePref` into
      localStorage beside the durable Preferences copy), one attribute, and the
      generated stylesheet carries `color-scheme` inside the same block. An id
      that is no longer in the catalog just misses every block and is corrected
      by `paintStoredTheme()` a moment later.
    -->
    <script>
      try {
        var pref = localStorage.getItem('vis.themePref');
        if (pref === 'light') pref = 'blockether-light';
        else if (pref === 'dark') pref = 'blockether-dark';
        if (pref && pref.trim()) document.documentElement.dataset.theme = pref.trim();
      } catch (e) {
        /* Private mode / storage disabled: the default palette is the answer. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The guard against a blank page. React owns `#root`, and nothing else draws
      there. If the module bundle never runs (a dev reload that met a half-written
      file, a chunk that failed to load) or the tree is lost, the page stays an
      empty sheet. This script does not need the bundle. A blank page has nothing
      to lose, so it starts the app again by itself, with a growing delay, and
      shows a quiet notice instead of white while it waits.
    -->
    <script>
      (function () {
        var BOOT_TIMEOUT_MS = 20000;
        var RETRY_MAX_MS = 30000;
        var RETRIES_KEY = 'vis.bootRetries';
        var root = document.getElementById('root');
        var mounted = false;
        var lastError = null;
        var surface = null;
        var retryTimer = null;
        var visibleMs = 0;

        function isBlank() {
          return root.childElementCount === 0;
        }

        function retries() {
          try {
            return Number(sessionStorage.getItem(RETRIES_KEY)) || 0;
          } catch (e) {
            return 0;
          }
        }

        // A hidden page waits: `visibilitychange` schedules the attempt again.
        function restart() {
          retryTimer = null;
          if (!isBlank() || document.visibilityState !== 'visible') return;
          try {
            sessionStorage.setItem(RETRIES_KEY, String(retries() + 1));
          } catch (e) {
            /* Storage disabled: the delay stays at its first step. */
          }
          location.reload();
        }

        function schedule() {
          if (retryTimer !== null || !surface || !isBlank()) return;
          retryTimer = setTimeout(restart, Math.min(RETRY_MAX_MS, 1000 * Math.pow(2, retries())));
        }

        function recover(message) {
          if (!isBlank()) return;
          if (!surface) {
            surface = document.createElement('div');
            surface.id = 'vis-boot-recovery';
            surface.setAttribute('role', 'status');
            surface.style.cssText =
              'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;' +
              'align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;' +
              'background:Canvas;color:CanvasText;font:15px/1.4 -apple-system,system-ui,sans-serif';
            var title = document.createElement('p');
            title.style.cssText = 'margin:0;font-weight:600';
            title.textContent = 'Starting Vis again…';
            var detail = document.createElement('p');
            detail.style.cssText =
              'margin:0;max-width:24rem;opacity:.6;font:12px/1.4 ui-monospace,monospace;overflow-wrap:anywhere';
            surface.append(title, detail);
            document.body.appendChild(surface);
          }
          surface.lastChild.textContent = message;
          schedule();
        }

        new MutationObserver(function () {
          if (!isBlank()) {
            mounted = true;
            clearTimeout(retryTimer);
            retryTimer = null;
            if (surface) surface.remove();
            surface = null;
            try {
              sessionStorage.removeItem(RETRIES_KEY);
            } catch (e) {
              /* Nothing to reset. */
            }
          } else if (mounted) {
            recover(lastError || 'The screen was removed.');
          }
        }).observe(root, { childList: true });

        // A module script that fails to load fires `error` on its element. That
        // event does not bubble, but the capture phase still sees it.
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') {
              if (!mounted) recover('A script failed to load: ' + (target.src || 'inline'));
              return;
            }
            lastError = String(event.message || event.error || 'Unknown error');
            if (!mounted) recover(lastError);
          },
          true,
        );

        var timer = setInterval(function () {
          if (mounted) return clearInterval(timer);
          if (document.visibilityState === 'visible') visibleMs += 1000;
          if (visibleMs >= BOOT_TIMEOUT_MS) {
            recover(lastError || 'The app did not start in ' + BOOT_TIMEOUT_MS / 1000 + ' seconds.');
          }
        }, 1000);

        document.addEventListener('visibilitychange', schedule);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
