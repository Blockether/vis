# Swarm Forge pack. Leave provider and model empty to use the session default.
name: two-pack
description: A coder implements each task. A cleaner reviews and tidies the change.
roles:
- name: coder
  title: Coder
  provider: null
  model: null
  receive: task
  propagation: forward-only
  prompt: |
    Implement the task with the smallest correct change.
    Follow the conventions of the code nearby.
    Add or update tests where the project has tests, and run them.
- name: cleaner
  title: Cleaner
  provider: null
  model: null
  receive: task
  propagation: back-one
  prompt: |
    Review the change of the previous role as a careful reviewer.
    Remove dead code, debug output and unrelated edits. Fix naming and formatting.
    Run the formatter, the linter and the tests that apply. Fix each failure.
