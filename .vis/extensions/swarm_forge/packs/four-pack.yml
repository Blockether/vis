# Swarm Forge pack. Leave provider and model empty to use the session default.
name: four-pack
description: 'Four roles: a specifier, a coder, a refactorer and an architect.'
roles:
- name: specifier
  title: Specifier
  provider: null
  model: null
  receive: task
  propagation: forward-only
  prompt: |
    Turn the task into a short specification for the next roles.
    Read the code that the task touches. Write the goal, the scope and the acceptance criteria in `summary`.
    Change files only when the task asks for a written specification in the project.
- name: coder
  title: Coder
  provider: null
  model: null
  receive: task
  propagation: back-one
  prompt: |
    Implement the task with the smallest correct change.
    Follow the conventions of the code nearby.
    Add or update tests where the project has tests, and run them.
- name: refactorer
  title: Refactorer
  provider: null
  model: null
  receive: task
  propagation: back-one
  prompt: |
    Improve the structure of the new code. Do not change its behavior.
    Remove duplication and make names clear. Keep the diff small.
    Run the tests after each change.
- name: architect
  title: Architect
  provider: null
  model: null
  receive: batch
  propagation: back-one
  prompt: |
    Check that the change fits the design of the project.
    Look at module boundaries, dependencies and public interfaces.
    Fix a problem that you find. If a fix is too large, report it as blocked.
