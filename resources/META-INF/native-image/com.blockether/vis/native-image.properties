# native-image build config for the vis application (com.blockether/vis).
#
# This is the CANONICAL home for vis's own native-image arguments: because it is
# bundled in the image classpath, native-image auto-applies these Args (no need
# to pass them on the command line — `clojure -T:build native` just supplies
# `-jar`/`-o`). Library jars on the classpath contribute their OWN config the
# same way, so vis MUST NOT duplicate what a dependency already declares.
#
# What vis adds:
#  - -Os: optimize the image for SIZE. Measured on the tui profile:
#    598 MB -> 504 MB (-16%; code area 175->102 MiB, code metadata
#    60->39 MiB), binary validated (doctor, gateway, smoke). vis is
#    IO/LLM-bound — peak compiled-code throughput is not the bottleneck.
#  - graal-build-time InitClojureClasses: initialize every Clojure-generated
#    class at build time (it ships no native-image.properties, so enable it here).
#    MEASURED LIMIT (do not "simplify" this again): graal-build-time registers
#    the classes it finds on the classpath, but NOT the classes a namespace
#    creates while it loads. Deleting the per-library --initialize-at-build-time
#    entries below fails the build within ~4 min of analysis, e.g.
#      "An object of type 'malli.core$eval15408$fn__15409' was found in the image
#       heap ... marked for initialization at image run time"
#      "An object of type 'com.taoensso.telemere.slf4j.TelemereServiceProvider'
#       was found in the image heap ..."
#    So every entry below is load-bearing: package-prefix entries for libraries
#    whose load-time eval/Java classes graal-build-time cannot see, and single
#    classes for the handful of JDK/Java offenders. Nothing here is decoration.
#  - (25.1 cleanup) --no-fallback and --report-unsupported-elements-at-runtime
#    are GONE: fallback images no longer exist and unsupported elements always
#    report at run time, so both are true no-ops GraalVM 25.1 warns on.
#  - --enable-url-protocols=https,http STAYS. Its 25.1 deprecation warning
#    ("use reachability metadata instead") is about the MECHANISM, not the
#    need: https is NOT on by default, and dropping the flag made the binary
#    die at runtime with "URL protocol https ... not enabled" the moment
#    anything touched an https URL (voice model download, provider calls,
#    models.dev catalog). Regression fixed by restoring it.
#  - native access / FFM: every downcall in the image — rift, fff, ruff,
#    imaging, tree-sitter and the embedded CPython bridge — needs
#    --enable-native-access. The Python interpreter itself is NOT in the image:
#    it is a cdylib plus a vendored tree the distribution ships beside the
#    binary and the runtime opens through VIS_PYTHON_NATIVE_PATH /
#    VIS_PYTHON_HOME. See vis-docs/jvm-native-image.md.
#
# The app-wide reachability config (Clojure/babashka/nREPL/sqlite/app reflection
# + resources) lives next to this file in reachability-metadata.json, generated
# by the native-image tracing agent.
Args = --features=clj_easy.graal_build_time.InitClojureClasses \
       -H:+UnlockExperimentalVMOptions \
       -H:+ReportExceptionStackTraces \
       -J--enable-native-access=ALL-UNNAMED \
       --enable-url-protocols=https,http \
       --enable-monitoring=jfr \
       --initialize-at-build-time=apple.security.AppleProvider \
       --initialize-at-build-time=com.fasterxml.jackson \
       --initialize-at-build-time=org.commonmark \
       --initialize-at-build-time=malli \
       --initialize-at-build-time=borkdude \
       --initialize-at-build-time=clj_kondo \
       --initialize-at-build-time=pod.borkdude \
       --initialize-at-build-time=sci \
       --initialize-at-build-time=bencode \
       --initialize-at-build-time=nrepl \
       --initialize-at-build-time=taoensso \
       --initialize-at-build-time=com.taoensso \
       --initialize-at-build-time=honey \
       --initialize-at-build-time=charred \
       --initialize-at-build-time=camel_snake_kebab \
       --initialize-at-build-time=flatland \
       --initialize-at-build-time=fipp \
       --initialize-at-build-time=edamame \
       --initialize-at-build-time=clj_yaml \
       --initialize-at-build-time=mikera \
       --initialize-at-build-time=org.eclipse.jetty.util.thread.ThreadIdPool \
       --initialize-at-build-time=org.eclipse.jetty.util.ProcessorUtils \
       --initialize-at-build-time=org.eclipse.jetty.util.MathUtils \
       --initialize-at-build-time=com.knuddels.jtokkit \
       --initialize-at-build-time=org.slf4j \
       --initialize-at-build-time=org.flywaydb.core.internal.util.FlywayDbWebsiteLinks \
       --initialize-at-build-time=org.flywaydb.core.internal.Topic \
       --initialize-at-build-time=clojure.lang.XMLHandler \
       -Os
