# native-image build config for the built-in speech subsystem.
#
# graal-build-time's InitClojureClasses feature initializes every
# Clojure-generated class at build time, so speech needs no per-namespace
# --initialize-at-build-time entry. Add Args here only for Java-library
# reachability uniquely pulled in by speech.
#
# The JNI registrations sherpa-onnx needs live in reachability-metadata.json,
# which carries the rule that produced them and the agent command that
# regenerates them.
