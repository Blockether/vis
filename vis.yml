# vis.yml — project config for the Vis checkout, snapshotted when an environment
# is created. Every knob and its default lives in resources/vis-docs/configuration.md
# (confinement: resources/vis-docs/jail.md). No `jail:` block here, so children
# run unconfined: full filesystem, open network.

# ── Workspace filesystem catalog ─────────────────────────────────────────────
# Every filesystem root Vis knows about. Per entry: `id` (the handle a
# jail.filesystem.allow list would reference), `path`, `description` (shown in
# the session access view), `access` (read-write by default), `search` (true by
# default; false keeps the root out of the default sweep, explicit paths still
# reach it) and `when`/`optional` for roots that only exist on some hosts.
workspace:
  filesystem:
    - id: fff
      path: ~/fff
      description: Blockether FFF fork — high-performance fuzzy file finder and grep engine.
    - id: clj-fff
      path: ~/clj-fff
      description: Blockether Clojure bindings for FFF.
    - id: clj-parinferish
      path: ~/clj-parinferish
      description: Sibling repo — conservative structural balancing for Clojure edits.
    - id: lanterna
      path: ~/lanterna
      description: Blockether Lanterna fork — release there, then move the com.blockether/lanterna pin in the TUI extension.
    - id: spel
      path: ~/spel
      description: Sibling repo — Spel CLI and runtime.
    - id: svar
      path: ~/svar
      description: Sibling repo — structured LLM output + routing library.
    - id: skjema
      path: ~/skjema
      description: Sibling repo — Blockether JSON Schema 2020-12 validator, reflection-free and native-image safe, validating EDN directly.
    - id: clj-imaging
      path: ~/clj-imaging
      description: Sibling repo — Blockether AWT-free imaging (decode/encode/transforms/SVG) over a first-party Rust cdylib.
    - id: vis-python-runtime
      path: ~/vis-python-runtime
      description: Sibling repo — first-party embedded Python runtime for the sandbox, replacing GraalPy in the native image; prebuilt per platform and pinned from vis' deps.edn.
    # Sources of the language extensions pinned under `extensions:` below.
    # Each is released from its own repo, then its version is bumped here.
    - id: vis-lang-interface
      path: ~/vis-lang-interface
      description: Sibling repo — shared result contract every Vis language extension returns.
      optional: true
    - id: vis-lang-clojure
      path: ~/vis-lang-clojure
      description: Sibling repo — source of the clj extension; zprint/cljfmt formatting, clj-kondo lint, Lazytest runs and the managed nREPL.
      optional: true
    - id: vis-lang-python
      path: ~/vis-lang-python
      description: Sibling repo — source of the py extension; ruff formatting and lint, pytest runs and a persistent Python REPL.
      optional: true
    - id: infrastructure
      path: ~/infrastructure
      description: Sibling repo — private operations automation. Nothing about it belongs in this repository.
    - id: blockether-com
      path: ~/blockether.com
      description: Sibling repo — source for the Blockether website.
    - id: actions-runner
      path: ~/actions-runner
      description: GitHub Actions runner — read-only diagnostics and installed version.
      access: read-only
      search: false
    # (`~/.vis` — Vis' own session folder — is granted implicitly by the engine.)
    # The Node/Vite cache for the companion build, granted so a jailed build
    # resolves what it already downloaded, but kept OUT of the default search
    # sweep. The Clojure and Python toolchains grant their own caches and
    # configuration from their own extensions, so neither needs a root here.
    - id: npm
      path: ~/.npm
      description: Node/Vite/Capacitor cache for the apps/vis-companion universal build.
      search: false

# ── Feature toggles ──────────────────────────────────────────────────────────
toggles:
  # Default false. ON here because this repo IS Vis: the agent needs to read its
  # own gateway event journals and session transcripts to debug them.
  introspection: true

# ── Extensions ───────────────────────────────────────────────────────────────
# Packages from Extension Center (https://vis.blockether.com/extensions/). The
# KEY is the `project.name` from the package's pyproject.toml. Install or
# refresh what is declared here with:
#   vis-agent extension sync --project --trust
extensions:
  vis-lang-interface:
    source: https://github.com/Blockether/vis-lang-interface
    version: "2.1.1"
  vis-lang-clojure:
    source: https://github.com/Blockether/vis-lang-clojure
    subdirectory: extension
    version: "1.5.1"
  vis-lang-python:
    source: https://github.com/Blockether/vis-lang-python
    version: "1.3.1"
