artifact: verification-policy
policy-id: vis-bridge-v1
bridge-path-sandbox:
  enforce?: true
  rules:
    - path-pattern: .bridge/
      access: none
rules:
- scope:
    subsystems:
    - bridge-extension
    change-categories:
    - code-only
    - tests-only
    - mixed
    risk-classes:
    - medium
    - high
  required-evidence:
    unit-tests: required
    property-tests: optional
    runtime-assertions: optional
    docs-or-nl-spec: recommended
  evidence-roles:
    regression:
    - unit
  notes:
  - Bridge extension changes require its unit suite; omission rationale belongs in ordinary project documentation.
