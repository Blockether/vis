# Vis e2e scenarios as a Harbor dataset: a host environment, a source agent,
# a dataset compiler and a grader. Run its tools from the repository root with
# `uv run --project e2e ...`.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vis-e2e"
version = "0.0.0"
description = "Run the Vis e2e scenarios as a Harbor dataset on the host."
requires-python = ">=3.12"
dependencies = ["harbor==0.23.0", "vis-agent"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
vis-agent = { path = "../packages/vis-agent", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["vis_harbor"]

[tool.pytest.ini_options]
testpaths = ["vis_harbor/tests"]
