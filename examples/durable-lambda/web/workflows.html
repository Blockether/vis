<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf3eb">
<title>Software factory · Workflows</title>
<link rel="icon" href="/dashboard/assets/logo.svg">
<link rel="stylesheet" href="/dashboard/vendor/cm-codemirror.min.css">
<link rel="stylesheet" href="/dashboard/assets/app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="/dashboard" aria-label="Software factory">
    <svg viewBox="0 0 1230 1381" aria-hidden="true"><path d="M614.79,125.623l-489.167,282.375l0,564.792l489.125,282.417l489.125,-282.417l0,-564.792l-489.083,-282.375Zm0,912.834l-301.417,-174.042l0,-122.958l409.209,-0l193.666,122.958l-301.458,174.042Zm107.75,-399.125l-409.167,-0l0,-122.959l301.417,-174.041l301.417,174.041l-193.667,122.959Z" fill="#fc0" stroke="#404040" stroke-width="25"/></svg>
    <span>Software factory <small>on AWS Lambda</small></span>
  </a>
  <nav class="nav" aria-label="Pages"><a href="/dashboard" aria-current="page">Workflows</a><a href="/dashboard/factory">Factory</a></nav>
  <span class="grow"></span>
  <span class="release" id="release" title="The release of the repository that this worker uses"><i></i><span><span class="only-wide" id="repository"></span><span id="commit">starting…</span></span></span>
  <a class="btn dark small" href="/dashboard/vis" title="Vis web: the sessions of this gateway">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6 M20 4l-9 9 M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
    <span>Sessions</span>
  </a>
</header>
<div class="tabs only-phone" id="phone-tabs" role="tablist">
  <button type="button" data-pane="list" aria-selected="false">List</button>
  <button type="button" data-pane="editor" aria-selected="true">Editor</button>
  <button type="button" data-pane="runs" aria-selected="false">Runs</button>
</div>
<div class="studio" id="studio" data-pane="editor">
  <section class="side" aria-label="Workflows">
    <div class="side-head">
      <div class="row"><h2>Workflows</h2><button class="btn small primary right" type="button" id="new">New</button></div>
      <p class="small muted" style="margin:0">Python on the Vis SDK. Each activity sends its requests to one Vis session.</p>
    </div>
    <div class="list" id="list"></div>
  </section>
  <section class="work" aria-label="Editor">
    <div class="editor-head" id="editor-head"></div>
    <div class="editor" id="editor"></div>
    <div class="problem" id="problem" hidden></div>
  </section>
  <section class="runs" aria-label="Runs">
    <div class="side-head" id="runs-head"></div>
    <div class="runs-body" id="runs"></div>
  </section>
</div>
<script src="/dashboard/vendor/cm-codemirror.min.js"></script>
<script src="/dashboard/vendor/cm-python.min.js"></script>
<script src="/dashboard/vendor/cm-matchbrackets.min.js"></script>
<script src="/dashboard/vendor/cm-closebrackets.min.js"></script>
<script src="/dashboard/vendor/cm-comment.min.js"></script>
<script src="/dashboard/vendor/cm-active-line.min.js"></script>
<script type="module" src="/dashboard/assets/workflows.js"></script>
</body>
</html>
