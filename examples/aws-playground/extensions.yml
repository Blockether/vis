# Extensions that the image installs and prepares at build time.
# Each version is exact, so two builds install the same code.
extensions:
  vis-lang-interface:
    source: https://github.com/Blockether/vis-lang-interface
    version: "3.4.0"
  vis-lang-clojure:
    source: https://github.com/Blockether/vis-lang-clojure
    subdirectory: extension
    version: "1.20.16"
  vis-lang-python:
    source: https://github.com/Blockether/vis-lang-python
    version: "1.16.10"
  # The review app has no approved release: the commit is the exact version.
  vis-review:
    source: https://github.com/Blockether/vis
    subdirectory: packages/vis-review
    revision: aed7d500953303f9621f694699a1a226d1ee9cd4
