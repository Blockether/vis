# native-image build config for the vis-foundation-voice extension.
#
# graal-build-time's InitClojureClasses feature (enabled by the main vis
# artifact) initializes every Clojure-generated class at build time, so this
# extension needs no per-namespace --initialize-at-build-time entry. Add Args
# here only for JAVA-library reachability this extension uniquely pulls in.
#
# reachability-metadata.json registers EVERY type of sherpa-onnx's API jar for
# JNI. sherpa's C++ reads its own Java API BY NAME - GetFieldID("model") on a
# config, FindClass("com/k2fsa/sherpa/onnx/WaveData") for a decoded recording -
# and native-image keeps no name it cannot see used, so an image that compiled
# and linked still failed at the first spoken or transcribed word. The whole
# package is registered by rule, and sherpa_test.clj compares the file with the
# jar so a version bump cannot silently drop a type. Regenerate it from that
# jar's class list, or trace a real run:
#   java -agentlib:native-image-agent=config-merge-dir=${.} -cp ... <exercise>
