name: 'Set up GraalVM CE (pinned)'
description: >-
  Installs GraalVM COMMUNITY Edition at the exact version pinned in
  `.graalvm-version` — the repo's single source of truth, shared with the
  Dockerfile, build.clj's native preflight and bin/require-graalvm. Nothing here
  hardcodes a version. The release tag, platform assets and checksums come from
  that file, avoiding resolver assumptions about CE innovation-train naming.
  Community, not Oracle: CE is GPLv2 + Classpath Exception.
  This is a native-build toolchain, not a requirement for running Vis on a JVM.
runs:
  using: composite
  steps:
    - name: Install pinned GraalVM CE
      shell: bash
      run: |
        set -euo pipefail

        # Single source of truth. Checkout must have run before this action.
        . "${GITHUB_WORKSPACE}/.graalvm-version"
        echo "Pinned: ${GRAAL_EDITION} ${GRAAL_VERSION} (${GRAAL_TAG} / ${GRAAL_ASSET_VERSION})"

        # Refuse a half-updated native-build pin before the expensive build.
        if [ "${GRAAL_PIN_LOCKED:-}" = "true" ] && [ "${GRAAL_VERSION}" != "${GRAAL_MAX_VERSION:-}" ]; then
          echo "::error::.graalvm-version is LOCKED at '${GRAAL_MAX_VERSION:-<unset>}' (NOT UPGRADABLE), got GRAAL_VERSION='${GRAAL_VERSION}'" >&2
          exit 1
        fi

        base="https://github.com/graalvm/graalvm-ce-builds/releases/download/${GRAAL_TAG}"

        # We consume THREE platforms: linux-x64, linux-aarch64 and macos-aarch64.
        # There is NO macos-x64 (Intel) community build, so that runner cannot be
        # used at all; Windows is not a supported target.
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)     slug="linux-x64";     sha="${GRAAL_SHA256_linux_x64}" ;;
          Linux/ARM64)   slug="linux-aarch64"; sha="${GRAAL_SHA256_linux_aarch64}" ;;
          macOS/ARM64)   slug="macos-aarch64"; sha="${GRAAL_SHA256_macos_aarch64}" ;;
          *) echo "No ${GRAAL_EDITION} ${GRAAL_VERSION} build for ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        file="graalvm-community-jdk-${GRAAL_ASSET_VERSION}_${slug}_bin.tar.gz"

        dest="${RUNNER_TEMP}/graalvm"
        archive="${RUNNER_TEMP}/graalvm-archive"
        mkdir -p "${dest}"

        echo "Downloading ${base}/${file}"
        curl -fL --retry 3 --retry-delay 5 -o "${archive}" "${base}/${file}"

        # The pin carries the digest, so a tampered/rewritten release asset is a
        # hard failure rather than a silently different JDK.
        # macOS runners have `shasum`, not coreutils' `sha256sum`.
        if command -v sha256sum >/dev/null 2>&1; then
          echo "${sha}  ${archive}" | sha256sum -c -
        else
          echo "${sha}  ${archive}" | shasum -a 256 -c -
        fi

        tar -xzf "${archive}" -C "${dest}"

        # Locate the extracted JDK home (macOS nests it under Contents/Home).
        java_bin="$(find "${dest}" -type f -name java -path '*/bin/*' | head -n1)"
        if [ -z "${java_bin}" ]; then
          echo "java executable not found after extraction" >&2
          exit 1
        fi
        unix_home="$(cd "$(dirname "${java_bin}")/.." && pwd)"

        # Assert what we actually got. `java.vendor.version` is the one property
        # that separates CE from Oracle GraalVM and from every stock JDK, and it
        # is the SAME string build.clj and bin/require-graalvm compare against.
        got="$("${java_bin}" -XshowSettings:properties -version 2>&1 |
                 sed -n 's/^ *java\.vendor\.version = //p' | head -n1)"
        if [ "${got}" != "${GRAAL_VENDOR_VERSION}" ]; then
          echo "::error::expected java.vendor.version '${GRAAL_VENDOR_VERSION}', got '${got}'" >&2
          exit 1
        fi
        # native-image is why we install a GraalVM at all; a JDK without it
        # would only fail hours later in the release job.
        if [ ! -x "${unix_home}/bin/native-image" ]; then
          echo "::error::no native-image in ${unix_home}/bin" >&2
          exit 1
        fi

        graalvm_home="${unix_home}"
        bin_dir="${unix_home}/bin"

        echo "JAVA_HOME=${graalvm_home}"       >> "${GITHUB_ENV}"
        echo "GRAALVM_HOME=${graalvm_home}"    >> "${GITHUB_ENV}"
        echo "${bin_dir}"                      >> "${GITHUB_PATH}"

        echo "✓ ${got} — ${graalvm_home}"
