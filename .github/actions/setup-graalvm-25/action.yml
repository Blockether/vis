name: 'Set up GraalVM CE (pinned)'
description: >-
  Installs GraalVM COMMUNITY Edition at the exact version pinned in
  `.graalvm-version` — the repo's single source of truth, shared with the
  Dockerfile, build.clj's native preflight and bin/require-graalvm. Nothing here
  hardcodes a version; bump `.graalvm-version` together with deps.edn's
  org.graalvm.* pins and every consumer follows.

  Why the asset is fetched directly instead of using graalvm/setup-graalvm:
    * Oracle GraalVM's 25.1+ *feature train* (innovation) releases are NOT on
      the free download.oracle.com channel -- they are GDS-token gated, so
      `distribution: graalvm` + `java-version: 25.1.3` 404s on
      graalvm-jdk-25.1.3_<os>_bin.tar.gz.
    * setup-graalvm's Community resolver predates the 25.1 innovation naming
      (release tag `graal-25.1.3`, asset `...-25i1-25.0.3...`), so
      `distribution: graalvm-community` cannot resolve it either.

  Community, not Oracle: CE is GPLv2 + Classpath Exception, which is what keeps
  the redistributed binary FOSS (audit/README.md §4.1). Exact version: the
  embedded GraalPy (Truffle) refuses a JDK whose built-in Truffle differs from
  the maven python-language jar.
runs:
  using: composite
  steps:
    - name: Install pinned GraalVM CE
      shell: bash
      run: |
        set -euo pipefail

        # Single source of truth. Checkout must have run before this action.
        . "${GITHUB_WORKSPACE}/.graalvm-version"
        echo "Pinned: ${GRAAL_EDITION} ${GRAAL_VERSION} (${GRAAL_TAG} / ${GRAAL_ASSET_VERSION})"

        base="https://github.com/graalvm/graalvm-ce-builds/releases/download/${GRAAL_TAG}"

        # graalvm-ce-builds ships FOUR platforms: linux-x64, linux-aarch64,
        # macos-aarch64 and windows-x64 — there is NO macos-x64 (Intel)
        # community build, so that runner cannot be used at all.
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64)     slug="linux-x64";     ext="tar.gz"; sha="${GRAAL_SHA256_linux_x64}" ;;
          Linux/ARM64)   slug="linux-aarch64"; ext="tar.gz"; sha="${GRAAL_SHA256_linux_aarch64}" ;;
          macOS/ARM64)   slug="macos-aarch64"; ext="tar.gz"; sha="${GRAAL_SHA256_macos_aarch64}" ;;
          Windows/X64)   slug="windows-x64";   ext="zip";    sha="${GRAAL_SHA256_windows_x64}" ;;
          *) echo "No ${GRAAL_EDITION} ${GRAAL_VERSION} build for ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        file="graalvm-community-jdk-${GRAAL_ASSET_VERSION}_${slug}_bin.${ext}"

        dest="${RUNNER_TEMP}/graalvm"
        archive="${RUNNER_TEMP}/graalvm-archive"
        mkdir -p "${dest}"

        echo "Downloading ${base}/${file}"
        curl -fL --retry 3 --retry-delay 5 -o "${archive}" "${base}/${file}"

        # The pin carries the digest, so a tampered/rewritten release asset is a
        # hard failure rather than a silently different JDK.
        # macOS runners have `shasum`, not coreutils' `sha256sum`.
        if command -v sha256sum >/dev/null 2>&1; then
          echo "${sha}  ${archive}" | sha256sum -c -
        else
          echo "${sha}  ${archive}" | shasum -a 256 -c -
        fi

        if [ "${RUNNER_OS}" = "Windows" ]; then
          # git-bash ships GNU tar (no .zip support); the OS-bundled bsdtar
          # (tar.exe) extracts .zip fine.
          /c/Windows/System32/tar.exe -xf "${archive}" -C "${dest}"
        else
          tar -xzf "${archive}" -C "${dest}"
        fi

        # Locate the extracted JDK home (macOS nests it under Contents/Home).
        java_bin="$(find "${dest}" -type f \( -name java -o -name java.exe \) -path '*/bin/*' | head -n1)"
        if [ -z "${java_bin}" ]; then
          echo "java executable not found after extraction" >&2
          exit 1
        fi
        unix_home="$(cd "$(dirname "${java_bin}")/.." && pwd)"

        # Assert what we actually got. `java.vendor.version` is the one property
        # that separates CE from Oracle GraalVM and from every stock JDK, and it
        # is the SAME string build.clj and bin/require-graalvm compare against.
        got="$("${java_bin}" -XshowSettings:properties -version 2>&1 |
                 sed -n 's/^ *java\.vendor\.version = //p' | head -n1)"
        if [ "${got}" != "${GRAAL_VENDOR_VERSION}" ]; then
          echo "::error::expected java.vendor.version '${GRAAL_VENDOR_VERSION}', got '${got}'" >&2
          exit 1
        fi
        # native-image is why we install a GraalVM at all; a JDK without it
        # would only fail hours later in the release job.
        if [ ! -x "${unix_home}/bin/native-image" ] && [ ! -f "${unix_home}/bin/native-image.cmd" ]; then
          echo "::error::no native-image in ${unix_home}/bin" >&2
          exit 1
        fi

        if [ "${RUNNER_OS}" = "Windows" ]; then
          graalvm_home="$(cygpath -w "${unix_home}")"
          bin_dir="$(cygpath -w "${unix_home}/bin")"
        else
          graalvm_home="${unix_home}"
          bin_dir="${unix_home}/bin"
        fi

        echo "JAVA_HOME=${graalvm_home}"       >> "${GITHUB_ENV}"
        echo "GRAALVM_HOME=${graalvm_home}"    >> "${GITHUB_ENV}"
        echo "${bin_dir}"                      >> "${GITHUB_PATH}"

        echo "✓ ${got} — ${graalvm_home}"
