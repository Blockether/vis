name: Test native Python SDK
description: Exercise installed SDK packages against the staged native release and its Python worker.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        version: "0.9.2"
        enable-cache: false
    - name: Install SDK wheels and test runner in an isolated environment
      shell: bash
      run: |
        uv venv --python 3.11 "$RUNNER_TEMP/vis-native-sdk-venv"
        uv pip install --python "$RUNNER_TEMP/vis-native-sdk-venv/bin/python" pytest ./packages/vis-agent
    - name: Exercise native HTTP and stdio outside the checkout
      shell: bash
      run: |
        "$RUNNER_TEMP/vis-native-sdk-venv/bin/python" - <<'PY'
        import os, shlex, subprocess, sys
        from pathlib import Path
        root = Path.cwd()
        binary = root / 'target/release-bundle/vis-agent'
        assert binary.is_file(), 'Stage the release before testing its SDK'
        env = {**os.environ, 'VIS_TEST_INSTALLED': '1',
               'VIS_TEST_LOCAL_COMMAND': shlex.join([str(binary)])}
        env.pop('VIS_PYTHON_NATIVE_PATH', None)  # exercise the bundled worker, not an override
        subprocess.run([sys.executable, '-m', 'pytest', str(root / 'packages/vis-agent/tests/test_engine.py'),
                        str(root / 'packages/vis-agent/tests/test_local.py'), '-q'],
                       cwd=os.environ['RUNNER_TEMP'], env=env, check=True)
        PY
