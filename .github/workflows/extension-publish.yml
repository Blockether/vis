name: Publish reviewed extension

on:
  schedule:
    # The release workflow of each first-party repository dispatches this workflow. This schedule
    # is a catch-up: GitHub starts scheduled runs of this repository some hours late or drops them.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      repository_url:
        description: Reviewed public GitHub repository; empty publishes the first-party releases
        default: ''
        type: string
      subdirectory:
        description: Extension project folder (empty for repository root)
        default: ''
        type: string
      release_tag:
        description: Published GitHub Release tag
        default: ''
        type: string
      revision:
        description: Full lowercase SHA reviewed for this release
        default: ''
        type: string

permissions:
  contents: read

jobs:
  targets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Resolve the releases to publish
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
          SUBDIRECTORY: ${{ inputs.subdirectory }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ -n "${REPOSITORY_URL:-}" ]; then
            if [ -z "${RELEASE_TAG:-}" ] || [ -z "${REVISION:-}" ]; then
              echo "A dispatched repository needs its release tag and the reviewed revision." >&2
              exit 1
            fi
            printf '%s %s %s %s\n' \
              "$REPOSITORY_URL" "${SUBDIRECTORY:--}" "$RELEASE_TAG" "$REVISION" > "$RUNNER_TEMP/targets"
          else
            : > "$RUNNER_TEMP/targets"
            cutoff=$(date -u -d '7 days ago' +%FT%TZ)
            while read -r repository folder prefix; do
              # The catalog lists a newer release of this repository: older tags are superseded.
              superseded=0
              if [ "$GITHUB_EVENT_NAME" = schedule ]; then
                if ! tags=$(gh api --paginate --slurp "repos/$repository/releases?per_page=100" | jq -r \
                  --arg prefix "$prefix" --arg cutoff "$cutoff" '
                    add | map(select((.draft or .prerelease) | not)
                      | select($prefix == "-" or (.tag_name | startswith($prefix))))
                    | sort_by(.published_at) | reverse
                    | to_entries[] | select(.key == 0 or .value.published_at >= $cutoff)
                    | .value.tag_name'); then
                  echo "::warning::Could not list releases for $repository."
                  continue
                fi
                subdirectory=$folder
                if [ "$subdirectory" = "-" ]; then subdirectory=""; fi
                url="https://github.com/$repository"
                identity=$(printf '%s\n%s' "${url,,}" "$subdirectory" | sha256sum | cut -c1-24)
                if ! status=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/catalog" -w '%{http_code}' \
                  "https://vis.blockether.com/api/extensions/$identity"); then
                  echo "::warning::Could not check the catalog for $repository."
                  continue
                fi
                case "$status" in
                  200)
                    if ! listed=$(jq -er '.releases | if type == "array" and all(.[]; (.release_tag | type) == "string") then map(.release_tag) | join("\n") else error("Invalid catalog releases") end' "$RUNNER_TEMP/catalog"); then
                      echo "::warning::Invalid catalog response for $repository."
                      continue
                    fi
                    ;;
                  404) listed='' ;;
                  *) echo "::warning::Catalog returned HTTP $status for $repository."; continue ;;
                esac
              elif [ "$prefix" = "-" ]; then
                tags=$(gh api "repos/$repository/releases/latest" --jq .tag_name 2>/dev/null || true)
              else
                tags=$(gh api --paginate --slurp "repos/$repository/releases?per_page=100" | jq -r \
                  --arg prefix "$prefix" '[add[] | select((.draft or .prerelease) | not)
                    | select(.tag_name | startswith($prefix))] | max_by(.published_at).tag_name // empty')
              fi
              while IFS= read -r tag; do
                [ -n "$tag" ] || continue
                if [ "$GITHUB_EVENT_NAME" = schedule ] && grep -Fxq -- "$tag" <<< "$listed"; then
                  superseded=1
                  continue
                fi
                if ! revision=$(gh api "repos/$repository/commits/$tag" --jq .sha); then
                  if [ "$GITHUB_EVENT_NAME" != schedule ]; then exit 1; fi
                  echo "::warning::Could not resolve $repository release $tag."
                  continue
                fi
                printf '%s %s %s %s %s\n' \
                  "https://github.com/$repository" "$folder" "$tag" "$revision" "$superseded" >> "$RUNNER_TEMP/targets"
              done <<< "$tags"
            done <<'FIRST_PARTY'
          Blockether/vis-lang-interface - -
          Blockether/vis-lang-python - -
          Blockether/vis-lang-javascript - -
          Blockether/vis-lang-clojure extension -
          Blockether/vis-decisions - -
          Blockether/vis-optmem - -
          Blockether/vis-graphify - -
          Blockether/vis-music - -
          Blockether/vis-podcaster - -
          Blockether/vis-reel - -
          Blockether/spel extensions/vis-spel vis-spel/v
          FIRST_PARTY
          fi
          cat "$RUNNER_TEMP/targets"
          {
            echo 'targets<<TARGETS_END'
            cat "$RUNNER_TEMP/targets"
            echo 'TARGETS_END'
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: targets
    if: needs.targets.outputs.targets != ''
    runs-on: ubuntu-latest
    environment: docs
    concurrency:
      group: docs-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/vis-docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-graalvm-25
      - uses: ./.github/actions/setup-clojure
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ runner.arch }}-
      - run: clojure -X:deps prep
        working-directory: .
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/vis-docs/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/vis-agent/pyproject.toml
      - run: python -m pip install './packages/vis-agent[docs]'
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Configure the approved catalog database
        env:
          DOCS_D1_DATABASE_ID: ${{ vars.DOCS_D1_DATABASE_ID }}
          DOCS_TURNSTILE_SITE_KEY: ${{ vars.DOCS_TURNSTILE_SITE_KEY }}
          DOCS_RATE_LIMIT_NAMESPACE: ${{ vars.DOCS_RATE_LIMIT_NAMESPACE }}
          DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
        run: node deploy.mjs
      - name: Recheck the reviewed releases and publish through authenticated moderation
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          while read -r repository folder tag revision superseded; do
            [ -n "$repository" ] || continue
            if [ "$folder" = "-" ]; then folder=""; fi
            if ! node moderate.mjs publish "$repository" "$folder" "$tag" "$revision" --remote --config .deployment.json; then
              if [ "${superseded:-0}" = 1 ]; then
                # Its tag cannot change, and the catalog already lists a newer release.
                echo "::warning::Could not publish superseded $repository release $tag."
              else
                echo "::error::Could not publish $repository release $tag."
                failed=1
              fi
            fi
          done <<< "$TARGETS"
          exit "$failed"
