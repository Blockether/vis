name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every commit that lands on main is verified on its own, so a push gets a group
# of its own: sharing one group per ref meant a rapid series of merges cancelled
# each other -- an in-progress run was killed by the next push, and even with
# cancellation off a PENDING run is always dropped when a newer one queues, so
# main could go a whole afternoon with no completed run at all (six in a row).
# A pull request keeps the per-ref group: there, superseding your own last push
# is exactly what you want.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Full test suite on Linux + macOS only. vis embeds GraalPy (Truffle) + rift
  # FFM, so tests run on the pinned GraalVM CE 25.1.3 (.graalvm-version, LOCKED —
  # not upgradable) via ./.github/actions/setup-graalvm-25, i.e. the exact JDK the
  # native binary is built with. Never Oracle GraalVM (GFTC) and never a stock JDK.
  # fail-fast false so each OS reports independently. Windows is not supported.
  tests:
    name: tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Oracle GraalVM's 25.1 feature train is GDS-token gated (not on the free
      # download channel) and setup-graalvm's CE resolver predates the 25.1
      # innovation naming, so we install the pinned graalvm-ce-builds asset
      # directly. Bump the version inside the action with deps.edn's
      # org.graalvm.* pins — Truffle/SVM refuse mismatches.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      # Several unit tests resolve the provider router. Seed the machine-owned
      # YAML state store with a minimal provider; transport-facing tests mock IO.
      - name: Seed a minimal AI provider config + harness fixtures
        shell: bash
        run: |
          mkdir -p "$HOME/.vis"
          cat > "$HOME/.vis/state.yml" <<'YAML'
          providers:
            - id: anthropic-coding-plan
              models:
                - name: claude-opus-4-8
              base-url: https://api.anthropic.com/v1
              api-key: ci-dummy-key
          YAML
          # Harness discovery scans ~/.claude/{agents,skills}; the dev machine
          # always has some. Seed the fixtures the harness tests expect.
          mkdir -p "$HOME/.claude/agents" "$HOME/.claude/skills/ci-skill"
          cat > "$HOME/.claude/agents/code-reviewer.md" <<'MD'
          ---
          name: code-reviewer
          description: CI fixture agent.
          model: sonnet
          ---
          You are a code reviewer.
          MD
          cat > "$HOME/.claude/skills/ci-skill/SKILL.md" <<'MD'
          ---
          name: ci-skill
          description: CI fixture skill.
          ---
          Do the thing.
          MD
      - name: Install bubblewrap + passt (Linux jail enforcer + filtered egress)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 ships an AppArmor policy that denies UNPRIVILEGED user
        # namespaces, so an installed `bwrap` can still fail to create the
        # namespace the Linux jail E2E contract requires (the suite then fails
        # on `sandbox-applicable?`). Relax the knob, then PROVE a real namespace
        # launches here so a denied kernel is a clear setup failure, not a
        # mysterious test failure 4 minutes later.
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap passt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --unshare-all --ro-bind / / /bin/true
      # The voice tests link sherpa-onnx's JNI, and the suite-wide network guard
      # refuses the JitPack download that would fetch it — so a runner without the
      # native fails every ASR/TTS test. Provision it in a JVM of its own first,
      # cached, and the suite then finds it on disk with no network at all.
      - uses: actions/cache@v6
        with:
          path: ~/.vis/native
          key: vis-native-${{ runner.os }}-${{ hashFiles('extensions/common/vis-foundation-voice/src/com/blockether/vis/ext/foundation_voice/sherpa.clj') }}
          restore-keys: vis-native-${{ runner.os }}-
      - name: Provision the sherpa-onnx native runtime
        run: |
          clojure -M -e "(require '[com.blockether.vis.ext.foundation-voice.sherpa :as sherpa]) (prn (sherpa/ensure-native!))"
      - name: Run test suite
        env:
          # These are hard CI contracts, not best-effort coverage: macOS must
          # execute fresh Seatbelt/socket E2E; Linux must execute real bwrap +
          # pasta enforcement. The test namespace fails if either runner cannot.
          VIS_REQUIRE_MACOS_SANDBOX_E2E: ${{ runner.os == 'macOS' && '1' || '0' }}
          VIS_REQUIRE_LINUX_SANDBOX_E2E: ${{ runner.os == 'Linux' && '1' || '0' }}
          # Both runners need an explicit heap: macOS starts smaller than the full
          # Truffle suite needs, and Linux's default (a quarter of RAM) ran the
          # suite out of heap. Leave headroom for native allocations and children.
          JAVA_TOOL_OPTIONS: ${{ runner.os == 'macOS' && '-Xmx5g' || '-Xmx6g' }}
        run: clojure -M:test

  # Every extension must resolve its own deps.edn cleanly — catches stale
  # :local/root paths or missing siblings the aggregate run would mask.
  classpath:
    name: classpath / ${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - .
          - extensions/persistance/vis-persistance-sqlite
          - extensions/providers/vis-provider-github-copilot
          - extensions/providers/vis-provider-openai-codex
          - extensions/providers/vis-provider-anthropic
          - extensions/providers/vis-provider-zai
          - extensions/providers/vis-provider-openrouter
          - extensions/providers/vis-provider-standard
          - extensions/channels/vis-channel-tui
          - extensions/common/vis-foundation-bridge
          - extensions/common/vis-foundation-search
          - extensions/common/vis-foundation-voice
          - extensions/languages/vis-language-clojure
    steps:
      - uses: actions/checkout@v7
      # See the tests job for why we install GraalVM CE 25.1.3 directly rather
      # than via graalvm/setup-graalvm.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Resolve ${{ matrix.path }} classpath
        run: cd ${{ matrix.path }} && clojure -Spath > /dev/null

  # The cheapest gate there is (~6 s for the whole tree) and the one a beta build
  # must not skip: clj-kondo through the repo's own :lint alias. It runs beside
  # the suite rather than after it — a lint error is worth reporting while the
  # tests are still going.
  lint:
    name: lint / clj-kondo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Lint the whole tree
        run: clojure -M:lint
  # AOT gate: compile EVERY namespace (core + every extension) exactly as the
  # native build's prepare-native-classes! does. This is what catches compile
  # errors (e.g. an unresolved symbol in an extension) BEFORE the slow, gated
  # native-image build ever starts — `clojure -M:test` alone does not compile
  # namespaces no test loads. Native Image runs only after this is green.
  aot:
    name: build / aot uberjar
    runs-on: ubuntu-latest
    needs: [tests, classpath, lint]
    steps:
      - uses: actions/checkout@v7
      # See the tests job for why we install GraalVM CE 25.1.3 directly rather
      # than via graalvm/setup-graalvm.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: AOT-compile all namespaces, refusing reflection or boxed math
        env:
          # The action above already installed the pinned CE. If build.clj still sees
          # the wrong JDK, that is a BROKEN SETUP — fail loudly instead of silently
          # SDKMAN-installing a second GraalVM inside the runner.
          VIS_AUTO_INSTALL_GRAALVM: "0"
        # `*warn-on-reflection*` and `*unchecked-math* :warn-on-boxed` only PRINT,
        # so a namespace that reflects stays green until somebody reads a build
        # log. This is the one pass that compiles EVERY namespace, and the same
        # AOT classes a native image is built from — make the warning the failure
        # here or it reaches a published binary.
        run: |
          set -o pipefail
          clojure -T:build uber 2>&1 | tee aot.log
          if grep -E 'Reflection warning|Boxed math warning' aot.log; then
            echo "::error::AOT emitted reflection or boxed-math warnings (listed above)"
            exit 1
          fi

  # The `vis` module, its outside-the-sandbox host and the declaration both of them
  # read are what PyPI installs as `vis-agent` and `vis-contract`, and the harness
  # cannot run their tests: vis' own embedded GraalPy resolves `vis` as a namespace
  # package, so this is the one suite that needs a stock CPython. It depends on
  # nothing the Clojure jobs build, so it runs beside them.
  # them. The interpreter is the FLOOR `pyproject.toml` advertises, and that floor is
  # the CPython level vis' own GraalPy implements: a module the engine execs cannot
  # be written in a Python the engine could not run.
  python-package:
    name: tests / vis-agent + vis-contract (PyPI packages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Neither package depends on anything outside this directory and none is
      # welcome; these are the test tools. ruff reads the repository's own ruff.toml,
      # one directory up. `vis-agent` finds `vis-contract` where its conftest looks —
      # the sibling checkout — so the pair is tested as written, never as last
      # published.
      - name: Install the test tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Run both package suites
        run: python -m pytest vis-agent/tests vis-contract/python/tests -q
      - name: Lint and format-check both packages
        run: |
          python -m ruff check .
          python -m ruff format --check .
      # The suites above run from source. This is the artifact check: both wheels
      # BUILD and the installed pair imports. `vis-contract` is not on PyPI yet, so
      # the API is installed against the sibling just built (`--no-deps`) instead of
      # resolving its pin — the day it resolves, drop the flag.
      - name: Build both wheels and import the installed pair
        run: |
          python -m pip install --disable-pip-version-check ./vis-contract/python
          python -m pip install --disable-pip-version-check --no-deps ./vis-agent
          cd "$RUNNER_TEMP"
          python -c 'import vis, vis_contract; print(vis_contract.VERSION, len(vis_contract.OPS), vis.__file__)'
