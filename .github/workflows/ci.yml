name: CI

on:
  # No test reads `examples/`, so a change of only an example starts no run.
  push:
    branches: [main]
    paths-ignore: ['examples/**']
  pull_request:
    branches: [main]
    paths-ignore: ['examples/**']
  workflow_call:
# New branch pushes supersede older checks. A reusable release check has its
# caller's workflow/ref, so it neither waits for nor cancels ordinary main CI.
# Tagged release verification must finish even when main advances.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}

jobs:
  # Full test suite on Linux + macOS only. vis embeds CPython (FFM),
  # so tests use the build JDK from .graalvm-version
  # via ./.github/actions/setup-graalvm-25, i.e. the exact JDK the
  # native binary is built with. JVM users may use any JDK 25+ distribution.
  # fail-fast false so each OS reports independently. Windows is not supported.
  #
  # Linux is the slowest runner, so four Linux jobs share the suite. `VIS_TEST_PART`
  # selects the part of each job; `test_selection.clj` has the parts and their times.
  # macOS runs all in one job: a hosted runner in one JVM, our own Mac in two JVMs
  # at the same time, because its one runner cannot share a job matrix.
  #
  # Only main pushes use the local Mac; all pull requests stay on hosted runners.
  tests:
    name: tests / ${{ matrix.name }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux python-cli, host: ubuntu-latest, part: python-cli }
          - { name: linux python-uv, host: ubuntu-latest, part: python-uv }
          - { name: linux python-ext, host: ubuntu-latest, part: python-ext }
          - { name: linux python, host: ubuntu-latest, part: python }
          - { name: linux core, host: ubuntu-latest, part: core }
          - { name: linux other, host: ubuntu-latest, part: other }
          - name: macos
            host: ${{ github.event_name == 'push' && fromJSON('["self-hosted","macOS","ARM64","vis-macos-arm64"]') || 'macos-26' }}
    steps:
      # CI fixtures must never overwrite the self-hosted user's Vis state.
      # A self-hosted runner can keep empty directories of an earlier home. An empty
      # package directory imports as a namespace package and hides a missing install.
      - name: Create isolated CI home
        run: |
          rm -rf "$RUNNER_TEMP/vis-ci-home"
          mkdir -p "$RUNNER_TEMP/vis-ci-home"
          echo "HOME=$RUNNER_TEMP/vis-ci-home" >> "$GITHUB_ENV"
          # The classpath resolver and execution JVM must use the same home.
          echo "JAVA_TOOL_OPTIONS=-Duser.home=$RUNNER_TEMP/vis-ci-home" >> "$GITHUB_ENV"
          # Keep Clojure dependencies outside the isolated home: where the cache
          # restores them on a GitHub-hosted runner, and in a store that stays
          # between jobs on a self-hosted runner. Remove recorded download failures,
          # because the resolver does not try those artifacts again.
          deps="$HOME"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then deps="$RUNNER_TOOL_CACHE/vis-clojure-deps"; fi
          for dir in .m2 .gitlibs; do
            mkdir -p "$deps/$dir"
            ln -s "$deps/$dir" "$RUNNER_TEMP/vis-ci-home/$dir"
          done
          find "$deps/.m2" \( -name '*.lastUpdated' -o -name resolver-status.properties \) -delete
      # Every workflow shares the self-hosted workspace. Git cannot unshallow a
      # treeless partial clone there, so start that workspace from a fresh clone.
      - name: Drop a partial clone from the shared workspace
        if: runner.environment == 'self-hosted'
        run: |
          config="$GITHUB_WORKSPACE/.git/config"
          if [ -f "$config" ] && git config --file "$config" --get remote.origin.promisor >/dev/null; then
            rm -rf "$GITHUB_WORKSPACE/.git"
          fi
      - uses: actions/checkout@v7
      # Oracle GraalVM's 25.1 feature train is GDS-token gated (not on the free
      # download channel) and setup-graalvm's CE resolver predates the 25.1
      # innovation naming, so we install the pinned graalvm-ce-builds asset
      # directly. Bump the version inside the action together with
      # `.graalvm-version` — native-image and its metadata are version-bound.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: ./.github/actions/setup-clojure
      - uses: actions/cache/restore@v6
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ runner.arch }}-
      # Several unit tests resolve the provider router. Seed the machine-owned
      # YAML state store with a minimal provider; transport-facing tests mock IO.
      - name: Seed a minimal AI provider config + harness fixtures
        shell: bash
        run: |
          mkdir -p "$HOME/.vis"
          cat > "$HOME/.vis/state.yml" <<'YAML'
          providers:
            - id: anthropic-coding-plan
              models:
                - name: claude-opus-4-8
              base_url: https://api.anthropic.com/v1
              api_key: ci-dummy-key
          YAML
          # Harness discovery scans ~/.claude/{agents,skills}; the dev machine
          # always has some. Seed the fixtures the harness tests expect.
          mkdir -p "$HOME/.claude/agents" "$HOME/.claude/skills/ci-skill"
          cat > "$HOME/.claude/agents/code-reviewer.md" <<'MD'
          ---
          name: code-reviewer
          description: CI fixture agent.
          model: sonnet
          ---
          You are a code reviewer.
          MD
          cat > "$HOME/.claude/skills/ci-skill/SKILL.md" <<'MD'
          ---
          name: ci-skill
          description: CI fixture skill.
          ---
          Do the thing.
          MD
      - name: Install bubblewrap + passt (Linux jail enforcer + filtered egress)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 ships an AppArmor policy that denies UNPRIVILEGED user
        # namespaces, so an installed `bwrap` can still fail to create the
        # namespace the Linux jail E2E contract requires (the suite then fails
        # on `sandbox-applicable?`). Relax the knob, then PROVE a real namespace
        # launches here so a denied kernel is a clear setup failure, not a
        # mysterious test failure 4 minutes later.
        run: |
          set -euo pipefail
          # Both packages come from Ubuntu, not the runner's unrelated browser repositories.
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y bubblewrap passt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --unshare-all --ro-bind / / /bin/true
      # The suite-wide network guard refuses native runtime downloads. Provision
      # Python and sherpa-onnx before the guarded suite, including on a cold home.
      - uses: actions/cache@v6
        with:
          path: ~/.vis/native
          key: vis-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps.edn', 'src/com/blockether/vis/internal/speech/sherpa.clj') }}
          restore-keys: vis-native-${{ runner.os }}-${{ runner.arch }}-
      # Extension fixtures import the vis-agent SDK, which needs its schema packages.
      # Install them into the shared sandbox packages before the guarded suite.
      # One JVM does all of this: each JVM start costs about 15 seconds on a hosted runner.
      - name: Prepare git dependencies and provision native runtimes and vis-agent packages
        run: |
          clojure -X:deps prep
          clojure -M -e "(require '[com.blockether.vis.internal.speech.sherpa :as sherpa] '[com.blockether.vis.internal.python.runtime :as python-runtime]) (prn (sherpa/ensure-native!)) (prn (python-runtime/ensure-library!)) (let [r (python-runtime/pip-install! [\"jsonschema>=4.23,<5\" \"pydantic==2.14.1\" \"referencing>=0.28.4\"])] (println (:out r)) (System/exit (int (:exit r))))"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.2"
          enable-cache: false
      # The project-runner regression shells real pytest, not embedded Python.
      # Use a disposable environment rather than the runner's global packages.
      # A self-hosted runner keeps $RUNNER_TEMP between jobs. Replace a leftover environment.
      - name: Provision pytest for project-runner tests
        run: |
          uv venv --clear "$RUNNER_TEMP/vis-project-pytest" --python python3
          uv pip install --python "$RUNNER_TEMP/vis-project-pytest/bin/python" pytest
          "$RUNNER_TEMP/vis-project-pytest/bin/python" -m pytest --version
          echo "$RUNNER_TEMP/vis-project-pytest/bin" >> "$GITHUB_PATH"
      # A main push skips `release-bundle-test` when no file that it reads differs from
      # the last green main commit. `test_selection.clj` has the paths. A release call, a
      # pull request and a run without that commit run the test.
      - name: Fetch the last green main commit
        id: green
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            -q '.workflow_runs[0].head_sha // empty' || true)"
          if [ -n "$sha" ] && git fetch --quiet --depth=1 origin "$sha"; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Run test suite
        env:
          # These are hard CI contracts, not best-effort coverage: macOS must
          # execute fresh Seatbelt/socket E2E; Linux must execute real bwrap +
          # pasta enforcement. The test namespace fails if either runner cannot.
          VIS_REQUIRE_MACOS_SANDBOX_E2E: ${{ runner.os == 'macOS' && '1' || '0' }}
          VIS_REQUIRE_LINUX_SANDBOX_E2E: ${{ runner.os == 'Linux' && '1' || '0' }}
          # Every runner needs an explicit heap: GitHub's hosted macOS image has
          # less memory than Linux, whose default quarter-RAM heap also exhausted.
          # Our own Apple-silicon runner has 36 GiB for four JVMs, so it takes the same size.
          JAVA_TOOL_OPTIONS: ${{ env.JAVA_TOOL_OPTIONS }} ${{ runner.os == 'macOS' && '-Xmx5g' || '-Xmx10g' }}
          VIS_TEST_PART: ${{ matrix.part }}
          VIS_TEST_BASE: ${{ steps.green.outputs.sha }}
          # Our Apple-silicon runner has the cores for four JVMs at the same time.
          VIS_TEST_PARTS: ${{ (runner.os == 'macOS' && runner.environment == 'self-hosted') && 'python-cli,python-uv python-ext,python core other' || '' }}
        # One JVM runs every namespace of its part in turn.
        run: |
          if [ -n "$VIS_TEST_PARTS" ]; then
            read -r -a parts <<< "$VIS_TEST_PARTS"
            bin/test-parts "${parts[@]}"
          else
            clojure -M:test
          fi

  # The TUI is its own project and never loads the engine, so its suite has its own job
  # and does not wait for the engine suite.
  tui:
    name: tui / ${{ matrix.name }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, host: ubuntu-latest }
          - name: macos
            host: ${{ github.event_name == 'push' && fromJSON('["self-hosted","macOS","ARM64","vis-macos-arm64"]') || 'macos-26' }}
    steps:
      # CI fixtures must never overwrite the self-hosted user's Vis state.
      # A self-hosted runner can keep empty directories of an earlier home. An empty
      # package directory imports as a namespace package and hides a missing install.
      - name: Create isolated CI home
        run: |
          rm -rf "$RUNNER_TEMP/vis-ci-home"
          mkdir -p "$RUNNER_TEMP/vis-ci-home"
          echo "HOME=$RUNNER_TEMP/vis-ci-home" >> "$GITHUB_ENV"
          # The classpath resolver and execution JVM must use the same home.
          echo "JAVA_TOOL_OPTIONS=-Duser.home=$RUNNER_TEMP/vis-ci-home" >> "$GITHUB_ENV"
          # Keep Clojure dependencies outside the isolated home: where the cache
          # restores them on a GitHub-hosted runner, and in a store that stays
          # between jobs on a self-hosted runner. Remove recorded download failures,
          # because the resolver does not try those artifacts again.
          deps="$HOME"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then deps="$RUNNER_TOOL_CACHE/vis-clojure-deps"; fi
          for dir in .m2 .gitlibs; do
            mkdir -p "$deps/$dir"
            ln -s "$deps/$dir" "$RUNNER_TEMP/vis-ci-home/$dir"
          done
          find "$deps/.m2" \( -name '*.lastUpdated' -o -name resolver-status.properties \) -delete
      # Every workflow shares the self-hosted workspace. Git cannot unshallow a
      # treeless partial clone there, so start that workspace from a fresh clone.
      - name: Drop a partial clone from the shared workspace
        if: runner.environment == 'self-hosted'
        run: |
          config="$GITHUB_WORKSPACE/.git/config"
          if [ -f "$config" ] && git config --file "$config" --get remote.origin.promisor >/dev/null; then
            rm -rf "$GITHUB_WORKSPACE/.git"
          fi
      - uses: actions/checkout@v7
      # Oracle GraalVM's 25.1 feature train is GDS-token gated (not on the free
      # download channel) and setup-graalvm's CE resolver predates the 25.1
      # innovation naming, so we install the pinned graalvm-ce-builds asset
      # directly. Bump the version inside the action together with
      # `.graalvm-version` — native-image and its metadata are version-bound.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: ./.github/actions/setup-clojure
      - uses: actions/cache/restore@v6
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Run standalone TUI suite
        working-directory: apps/vis-tui
        run: clojure -X:deps prep && clojure -M:test

  # The only job that saves the Clojure dependency cache. Other jobs only restore it,
  # so a partial resolution or a recorded download failure cannot become the cache.
  deps:
    name: deps / cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-clojure
      - id: deps
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          lookup-only: true
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-graalvm-25
      - name: Resolve every classpath that CI and the release workflows read
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          clojure -X:deps prep
          for alias in test lint audit vis native test-native; do clojure -P -M:"$alias"; done
          clojure -P -T:build
          (cd apps/vis-tui && clojure -X:deps prep && clojure -P -M:test && clojure -P -T:build)
          find ~/.m2 \( -name '*.lastUpdated' -o -name resolver-status.properties \) -delete
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: ${{ steps.deps.outputs.cache-primary-key }}

  # Every deps.edn project in the tree must resolve cleanly on its own — catches
  # a stale :local/root path or a missing sibling the aggregate run would mask.
  classpath:
    name: classpath / ${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - .
          - apps/vis-tui
    steps:
      - uses: actions/checkout@v7
      # Install the pinned CE build toolchain directly.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: ./.github/actions/setup-clojure
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve ${{ matrix.path }} classpath
        run: cd ${{ matrix.path }} && clojure -X:deps prep && clojure -Spath > /dev/null

  # The cheapest gate there is (~6 s for the whole tree) and the one a beta build
  # must not skip: clj-kondo through the repo's own :lint alias. It runs beside
  # the suite rather than after it — a lint error is worth reporting while the
  # tests are still going.
  lint:
    name: lint / clj-kondo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-graalvm-25
      - uses: ./.github/actions/setup-clojure
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Lint the whole tree
        run: clojure -X:deps prep && clojure -M:lint
  # The official MCP client conformance suite, against the MCP client of Vis with
  # its real configuration and OAuth code. The suite brings its own MCP and
  # authorization servers on loopback, so the job needs no secret and no account.
  # `bin/mcp-conformance` pins the suite version. A failed check or a warning
  # fails the job.
  mcp-conformance:
    name: mcp / client conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-graalvm-25
      - uses: ./.github/actions/setup-clojure
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Run the MCP client conformance suite
        run: clojure -X:deps prep && bin/mcp-conformance
  # AOT gate: compile EVERY namespace (core + every extension) exactly as the
  # native build's prepare-native-classes! does. This is what catches compile
  # errors (e.g. an unresolved symbol in an extension) BEFORE the slow, gated
  # native-image build ever starts — `clojure -M:test` alone does not compile
  # namespaces no test loads. Native Image runs only after this is green.
  aot:
    name: build / aot uberjar
    runs-on: ubuntu-latest
    # Independent compilation catches errors while the slower test suites run.
    steps:
      - uses: actions/checkout@v7
      # Install the pinned CE build toolchain directly.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: ./.github/actions/setup-clojure
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CLOJURE_CLI_VERSION }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          restore-keys: deps-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: AOT-compile all namespaces, refusing reflection or boxed math
        env:
          # The action above already installed the pinned CE. If build.clj still sees
          # the wrong JDK, that is a BROKEN SETUP — fail loudly instead of silently
          # SDKMAN-installing a second GraalVM inside the runner.
          VIS_AUTO_INSTALL_GRAALVM: "0"
        # `*warn-on-reflection*` and `*unchecked-math* :warn-on-boxed` only PRINT,
        # so a namespace that reflects stays green until somebody reads a build
        # log. This is the one pass that compiles EVERY namespace, and the same
        # AOT classes a native image is built from — make the warning the failure
        # here or it reaches a published binary.
        run: |
          set -o pipefail
          clojure -X:deps prep
          clojure -T:build uber 2>&1 | tee aot.log
          if grep -E 'Reflection warning|Boxed math warning' aot.log; then
            echo "::error::AOT emitted reflection or boxed-math warnings (listed above)"
            exit 1
          fi

  # The installed distributions and real HTTP/stdio SDK lifecycle share one gate.
  python-package:
    uses: ./.github/workflows/python-packages.yml
