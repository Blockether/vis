name: Native Release

# Companion to release.yml (which cuts the GitHub Release + Clojars deploy of the
# libraries/extensions). On each `v*` tag this builds ONE native distribution
# per OS (community only — there is no air-gapped/"corporate" variant):
#   vis-<os>-community  — the FULL agent: every channel (TUI + web + Telegram),
#                         voice ASR, AND the web/network `search` extension. The
#                         ~465 MB Parakeet voice model is NOT embedded — it
#                         downloads on first use, so the binary stays lean.
# Each binary carries ONLY its own build host's native libs, never another
# platform's.
#
# The native binary is the ONLY distributed application artifact — there is no
# JVM uberjar release asset. Libraries/extensions still publish to Clojars from
# release.yml for people writing extensions. Tags only; never feature branches.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # upload assets to the release

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: native / ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sizing here is MEASURED, not guessed. The same build was reproduced
          # locally (GraalVM 25.1.3, `clojure -T:build native-image-only`, 4
          # builder threads) to find what the [2/8] analysis actually needs for
          # this image (313k reachable methods, 84.6k types, 425 MB image heap):
          #   -J-Xmx5g   -> OutOfMemoryError: Java heap space        (7 min in)
          #   -J-Xmx8g   -> OutOfMemoryError: GC overhead limit      (9 min in)
          #   -J-Xmx10g  -> OutOfMemoryError: GC overhead limit      (9 min in)
          #   -J-Xmx12g  -> SUCCESS, peak RSS 13.5 GB, 63% of the time in GC
          # So the v0.1.0..v0.1.8 failures were never reflection/resource config
          # or thread counts: the builder was simply short of heap, and the
          # DeadlockWatchdog then aborted a build that was only GC-thrashing.
          # Free standard runners that can host it (larger runners are a paid
          # Team/Enterprise feature this community project does not use):
          #   ubuntu-latest   4 cores / 16 GB x64    -> proven: v0.1.8 in 1 h 58 m
          #   macos-15-intel  4 cores / 14 GB x64
          #   macos-15/26     3 cores /  7 GB arm64  -> impossible, never use
          # -H:DeadlockWatchdogInterval=0 keeps a slow-but-progressing analysis
          # alive; -J-Xms == -Xmx commits the heap up front instead of paying
          # repeated full GCs while it ratchets up under an already-full old gen.
          - { os: ubuntu-latest, profile: community, bin: target/vis, asset: vis-linux-x64-community, extra_args: '-J-Xmx12g -J-Xms12g -J-XX:+UseParallelGC -H:NumberOfThreads=4 -H:DeadlockWatchdogInterval=0' }
          # macOS ships as an x86_64 binary built on the free 14 GB Intel runner;
          # Apple silicon runs it under Rosetta 2 (vis is I/O-bound, so that costs
          # nothing that matters). Every darwin-x64 FFM artifact vis needs
          # (fff/rift/ruff + tree-sitter-language-pack macos-x86_64) is published.
          # Keep the builder on its default G1: ParallelGC's GC-overhead-limit
          # turns a slow build into an OutOfMemoryError, and 14 GB has no slack.
          - { os: macos-15-intel, profile: community, bin: target/vis, asset: vis-macos-x64-community, extra_args: '-J-Xmx12g -J-Xms2g -H:NumberOfThreads=4 -H:DeadlockWatchdogInterval=0' }
    steps:
      - uses: actions/checkout@v7
      # GraalVM COMMUNITY Edition (GPLv2 + Classpath Exception) — the SAME pinned
      # graalvm-ce-builds asset CI installs. Keeps Oracle GraalVM (GFTC) OUT of
      # the distributed binary, so the redistribution/license story stays FOSS.
      # Bump the version inside the action together with deps.edn's org.graalvm.*
      # pins — Truffle/SVM refuse mismatches.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
            ~/.vis/build-cache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      # community: full agent, model downloads on first use (lean binary).
      # GitHub's Linux runner ships ~4 GB of swap; back the 12 GB builder heap with
      # a real swapfile instead of letting the JVM die on GC overhead.
      - name: Enlarge builder swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Build native image
        env:
          VIS_NATIVE_EXTRA_ARGS: ${{ matrix.extra_args }}
        run: clojure -T:build native :profile :${{ matrix.profile }}
      - name: Stage asset
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"
      - name: Smoke-test the binary
        shell: bash
        run: ./"${{ matrix.bin }}" help >/dev/null
      # Deeper smoke: boot the gateway. A client command auto-spawns the DETACHED
      # gateway daemon, which builds the FULL reitit router from EVERY channel's
      # route contributions and does a real HTTP round-trip. A broken/conflicting
      # route table makes the daemon exit on startup and the client prints
      # "gateway daemon did not become ready" — a class of failure `help`
      # (in-process, no router) can never catch. Fail HERE rather than ship a
      # binary whose gateway (and thus every agent turn) can't run.
      - name: Smoke-test the gateway
        shell: bash
        run: |
          set -uo pipefail
          out="$(./"${{ matrix.bin }}" providers status anthropic 2>&1 || true)"
          echo "$out"
          if printf '%s\n' "$out" | grep -q 'did not become ready'; then
            echo '::error::gateway daemon failed to boot — the route table is broken'
            exit 1
          fi
          ./"${{ matrix.bin }}" gateway stop >/dev/null 2>&1 || true
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
