name: Native Release

# Companion to release.yml (which cuts the GitHub Release + Clojars deploy of the
# libraries/extensions). On each `v*` tag this builds one native distribution
# per platform that a FREE runner can actually build (community only — there is
# no air-gapped/"corporate" variant; see the matrix for why macOS is not here):
#   vis-<os>-<arch>-community  — the FULL agent: every channel (TUI + web + Telegram),
#                         voice ASR, AND the web/network `search` extension. The
#                         ~465 MB Parakeet voice model is NOT embedded — it
#                         downloads on first use, so the binary stays lean.
# Each binary carries ONLY its own build host's native libs, never another
# platform's.
#
# The native binary is the ONLY distributed application artifact — there is no
# JVM uberjar release asset. Libraries/extensions still publish to Clojars from
# release.yml for people writing extensions. Tags only; never feature branches.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build and attach to (empty = this ref)"
        type: string
        default: ''

permissions:
  contents: write          # upload assets to the release

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: native / ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350   # a swapping analysis is slow; only a 6 h job is hard-capped
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sizing here is MEASURED, not guessed. The same build was reproduced
          # locally (GraalVM 25.1.3, `clojure -T:build native :profile :community`)
          # to find what the [2/8] analysis actually needs for
          # this image (313k reachable methods, 84.6k types, 425 MB image heap):
          #   -J-Xmx5g   -> OutOfMemoryError: Java heap space        (7 min in)
          #   -J-Xmx8g   -> OutOfMemoryError: GC overhead limit      (9 min in)
          #   -J-Xmx10g  -> OutOfMemoryError: GC overhead limit      (9 min in)
          #   -J-Xmx12g  -> SUCCESS, peak RSS 13.5 GB, 63% of the time in GC
          # So the v0.1.0..v0.1.8 failures were never reflection/resource config
          # or thread counts: the builder was simply short of heap, and the
          # DeadlockWatchdog then aborted a build that was only GC-thrashing.
          # We therefore do NOT cap builder threads (-H:NumberOfThreads): capping
          # them only stretches the wall clock while the peak live set — the
          # thing that actually OOMs — stays the same. Let the builder use every
          # core the runner has.
          # Free standard runners that can host it (larger runners are a paid
          # Team/Enterprise feature this community project does not use):
          #   ubuntu-latest    4 cores / 16 GB x64    -> proven: v0.1.8, 1 h 58 m
          #   ubuntu-24.04-arm 4 cores / 16 GB arm64  -> same class, same args
          #   macos-15/26      3 cores /  7 GB arm64  -> impossible, never use
          # -H:DeadlockWatchdogInterval=0 keeps a slow-but-progressing analysis
          # alive. That plus a heap ceiling is ALL the builder tuning there is
          # here, on purpose: babashka and clojure-lsp ship far bigger native
          # images with nothing but `-J-Xmx` (bb: 4.5 GB, `-O1`, no GC, thread
          # or charset flags at all).
          # The v0.1.14 saga is the evidence for that minimalism. -J-Xmx12g,
          # 14g, 18g, -Xms==-Xmx, ParallelGC, G1, swapfiles: every one of them
          # OOM'd or thrashed, and a 36 GB Mac OOM'd at -J-Xmx24g too. No GC
          # setting fixes a live set that big; the live set was the bug.
          # It came from TWO build flags, now dropped in build.clj:
          #   * -Dpolyglot.image-build-time.PreinitializeContexts=python built
          #     a whole Python context during analysis and snapshotted it into
          #     the image heap;
          #   * -H:+AddAllCharsets dragged every sun.nio.cs charset in with it.
          # The agent-traced reflection metadata is gone too (1263 entries ->
          # 0; only resources + FFM downcalls remain), together with the
          # 30-entry --initialize-at-build-time list in native-image.properties:
          # graal-build-time's InitClojureClasses is the only Clojure lever,
          # exactly like babashka/clojure-lsp.
          - { os: ubuntu-latest, bin: target/vis, asset: vis-linux-x64-community, extra_args: '-J-Xmx22g -H:DeadlockWatchdogInterval=0' }
          - { os: ubuntu-24.04-arm, bin: target/vis, asset: vis-linux-arm64-community, extra_args: '-J-Xmx22g -H:DeadlockWatchdogInterval=0' }
          # NO macOS job, and that is a hard constraint, not an oversight:
          #   * the only free arm64 macOS runners have 7 GB — less than half of
          #     what the builder needs (v0.1.6/v0.1.8 each burned 4 h there);
          #   * graalvm-ce-builds publishes NO macos-x64 asset for 25.1.3 (only
          #     linux-x64, linux-aarch64, macos-aarch64, windows-x64), so the
          #     free 14 GB Intel runner has no community JDK to build with —
          #     v0.1.9's macos-15-intel job died in setup for exactly that;
          #   * bigger runners are a paid Team/Enterprise feature, and vis is a
          #     community project that uses only free standard runners.
          # macOS arm64 binaries are therefore built by a maintainer on an Apple
          # silicon Mac with GraalVM CE 25.1.3 (`clojure -T:build native :profile
          # :community`, needs ~16 GB free RAM) and uploaded to the release.
    steps:
      # A dispatch may name an ALREADY-PUSHED tag: build that tag's source with
      # THIS (fixed) workflow file, and attach the asset to that tag's release —
      # otherwise a CI-only fix could never be applied to a release already cut.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # GraalVM COMMUNITY Edition (GPLv2 + Classpath Exception) — the SAME pinned
      # graalvm-ce-builds asset CI installs. Keeps Oracle GraalVM (GFTC) OUT of
      # the distributed binary, so the redistribution/license story stays FOSS.
      # Bump the version inside the action together with deps.edn's org.graalvm.*
      # pins — Truffle/SVM refuse mismatches.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
            ~/.vis/build-cache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      # community: full agent, model downloads on first use (lean binary).
      # GitHub's Linux runner ships ~4 GB of swap; back the 12-14 GB builder heap
      # with a real swapfile instead of letting the JVM die on GC overhead.
      - name: Enlarge builder swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Build native image
        env:
          VIS_NATIVE_EXTRA_ARGS: ${{ matrix.extra_args }}
        run: clojure -T:build native
      - name: Stage asset
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"
      - name: Smoke-test the binary
        shell: bash
        run: ./"${{ matrix.bin }}" help >/dev/null
      # Deeper smoke: boot the gateway. A client command auto-spawns the DETACHED
      # gateway daemon, which builds the FULL reitit router from EVERY channel's
      # route contributions and does a real HTTP round-trip. A broken/conflicting
      # route table makes the daemon exit on startup and the client prints
      # "gateway daemon did not become ready" — a class of failure `help`
      # (in-process, no router) can never catch. Fail HERE rather than ship a
      # binary whose gateway (and thus every agent turn) can't run.
      - name: Smoke-test the gateway
        shell: bash
        run: |
          set -uo pipefail
          out="$(./"${{ matrix.bin }}" providers status anthropic 2>&1 || true)"
          echo "$out"
          if printf '%s\n' "$out" | grep -q 'did not become ready'; then
            echo '::error::gateway daemon failed to boot — the route table is broken'
            exit 1
          fi
          ./"${{ matrix.bin }}" gateway stop >/dev/null 2>&1 || true
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          # A dispatched rebuild must land on the tag it was asked for, not on
          # the branch ref the dispatch ran from.
          tag_name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
