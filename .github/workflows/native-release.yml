name: Native Release

# Companion to release.yml (which cuts the GitHub Release + Clojars deploy of the
# libraries/extensions). A dispatch can build one native distribution per
# requested platform. Linux uses free GitHub runners; the macOS ARM64 image is
# built on our own Apple-silicon runner, documented below. Every build is the
# community distribution; there is no air-gapped/"corporate" variant:
#   vis-agent-<os>-<arch>-community.tar.gz — the full distribution: the
#                         `vis-agent` Bash wrapper plus its private native
#                         runtime, with every UI channel (TUI + web + Telegram),
#                         voice ASR, and the web/network `search` extension.
#                         The ~465 MB Parakeet voice model is not embedded; it
#                         downloads on first use, so the runtime stays lean.
# Each runtime carries only its build host's native libraries.
#
# The wrapper bundle is the distributed application artifact; there is no JVM
# uberjar release asset. Libraries/extensions still publish to Clojars from
# release.yml for people writing extensions.
#
# TAG PUBLISHING IS OFF — releases are JVM-only for now. v0.1.39 and v0.1.40 both
# shipped with NO native asset at all: hosted macOS never finished the image
# (5 h 51 min, killed by its own timeout) and linux-arm64 died of
# OutOfMemoryError in the points-to analysis on a 16 GB runner. A tag that
# reliably produces nothing is worse than a tag that does not try: the release
# is the `vis-agent` launcher plus Clojars, and the launcher already runs the
# JVM source runtime when no native sidecar is installed. This workflow stays
# dispatch-only so a platform can be re-proven by hand; restore
# `push: {tags: ["v[0-9]*"]}` here (and its assertion in
# test/com/blockether/vis/release_bundle_test.clj) once a green run exists for
# every asset in the matrix.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build and attach to (empty = this ref; a branch is a dry run that publishes nothing)"
        type: string
        default: ''
      runner:
        description: "Optional runner-label override for the macOS arm64 job (default: vis-macos-arm64)"
        type: string
        default: ''
      only:
        description: "Which jobs to run — an experiment on one platform should not spend two hours of Linux builds"
        type: choice
        options: [all, linux, macos]
        default: all
      native_args:
        description: "VIS_NATIVE_EXTRA_ARGS for this run (empty = the matrix defaults / low-memory runner fallback)"
        type: string
        default: ''
      builder_heap:
        description: "VIS_NATIVE_BUILDER_HEAP: 'natural' lets native-image size its own builder heap, '<n>g' pins one"
        type: string
        default: ''

permissions:
  contents: write          # upload assets to the release

concurrency:
  group: native-release-${{ github.ref }}-${{ inputs.only }}-${{ inputs.runner }}-${{ inputs.builder_heap }}-${{ inputs.native_args }}
  cancel-in-progress: false

jobs:
  native:
    name: native / ${{ matrix.asset }}
    if: inputs.only != 'macos'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350   # a swapping analysis is slow; only a 6 h job is hard-capped
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sizing here is MEASURED, not guessed — from the builder's own output.
          # This image is GC-BOUND on every free runner: the points-to analysis
          # live set is ~13.7 GiB (native-image prints that number itself) while a
          # free standard runner has 16 GB in total. Measured arm64 history, same
          # runner class, same `-J-Xmx14g -J-Xms8g`:
          #   v0.1.11  284,910 methods  136.66 MiB resources  70.2% in GC   82 m
          #   v0.1.12  286,696 methods  137.28 MiB resources  67.7% in GC   85 m
          #   v0.1.22  278,614 methods  156.78 MiB resources  73.5% in GC   86 m
          #   v0.1.24  279,489 methods  157.03 MiB resources  79.1% in GC  130 m
          # Reachable code did NOT grow — the embedded resources/image heap did,
          # and past ~13 GiB of live set every extra MiB costs MINUTES, because GC
          # time grows super-linearly as the heap fills. Peak RSS is already
          # 14.1-14.9 GiB of the runner's 16 GB.
          # x64 at `-J-Xmx12g` fell off that cliff in v0.1.23/v0.1.24: 92.8% of
          # [4/8] parsing, 89.4% of [6/8] compiling and 98.0% of [7/8] laying out
          # spent in GC, then "OutOfMemoryError: Java heap space" after 3 h — and
          # NO x64 asset on the release. arm64 built the same commits at 14g, so
          # x64 now gets the identical arguments.
          #   -J-Xmx5g   -> OutOfMemoryError: Java heap space        (7 min in)
          #   -J-Xmx8g   -> OutOfMemoryError: GC overhead limit      (9 min in)
          #   -J-Xmx10g  -> OutOfMemoryError: GC overhead limit      (9 min in)
          #   -J-Xmx12g  -> green until v0.1.22, OOM from v0.1.23 on
          #   -J-Xmx14g  -> green on arm64 through v0.1.24
          #   no extra_args AND no swapfile (measured on v0.1.27, run
          #   30813650461): the builder sizes its own heap from total RAM, then
          #   both jobs sat in [2/8] analysis until "OutOfMemoryError: Java heap
          #   space" — arm64 at 61 min, x64 at 76 min, with ZERO assets. The same
          #   tag with the settings below was green at 97 min (arm64) and 72 min
          #   (x64). Dropping the swapfile or the -J-Xmx/-J-Xms pair does not make
          #   the build faster, it makes it fail slowly.
          # The only real speed-ups left are a BIGGER BUILDER (a CLOUD
          # Apple-silicon/32 GB runner, like the macos job: 13 min) or
          # `bin/release-native --tag vX.Y.Z --upload` on a 32 GB+ workstation,
          # where analysis takes 166 s instead of 553 s.
          # DO NOT raise -J-Xmx above runner RAM again: the v0.1.14 attempts at
          # 18g/22g (plus a swapfile, G1, no -Xms) only moved the builder into
          # swap, where the analysis thrashes instead of finishing. And do NOT cap
          # builder threads (-H:NumberOfThreads): that only stretches the wall
          # clock while the peak live set — the thing that OOMs — stays the same.
          # -H:DeadlockWatchdogInterval=0 keeps a slow-but-progressing analysis
          # alive; -J-Xms starts the heap big enough that the builder does not pay
          # repeated full GCs while ratcheting up under an already-full old gen,
          # without committing the whole runner up front.
          # Free standard runners that can host it (larger runners are ALWAYS
          # billed, even for public repositories, so this community project does
          # not use them):
          #   ubuntu-latest    4 cores / 16 GB x64
          #   ubuntu-24.04-arm 4 cores / 16 GB arm64
          # There is no flag left to win with: the next time this cliff is hit the
          # fix is a BIGGER BUILDER (an 8-core/32 GB larger runner, or a
          # self-hosted 32 GB box), or less reachable code — not more tuning.
          - { os: ubuntu-latest, bin: target/vis, asset: vis-agent-linux-x64-community.tar.gz, extra_args: '-J-Xmx14g -J-Xms8g -J-XX:+UseParallelGC -H:DeadlockWatchdogInterval=0' }
          - { os: ubuntu-24.04-arm, bin: target/vis, asset: vis-agent-linux-arm64-community.tar.gz, extra_args: '-J-Xmx14g -J-Xms8g -J-XX:+UseParallelGC -H:DeadlockWatchdogInterval=0' }
          # macOS arm64 is NOT in this matrix: it needs its own heap sizing and
          # its own runner, so it is the SEPARATE `macos` job below, on our own
          # labelled Apple-silicon builder. Every hosted macOS class GitHub
          # sells is under the ~13.7 GiB live set (specs re-checked 2026-08):
          #   * free arm64 macOS (macos-latest/14/15/26) is 3 cores / 7 GB with
          #     14 GB of disk, so swap cannot back a bigger heap either;
          #   * free macos-15-intel / macos-26-intel is 4 cores / 14 GB — still
          #     short once the OS is accounted for — and graalvm-ce-builds
          #     publishes NO macos-x64 asset for 25.1.3 (setup-graalvm-25 maps
          #     only linux-x64, linux-aarch64, macos-aarch64), so v0.1.9's Intel
          #     job died in setup for that, and an x64 binary is the wrong asset
          #     for Apple silicon anyway;
          #   * the PAID macos-*-xlarge (M2, 5 cores) has 14 GB, and
          #     macos-*-large is the same dead Intel end;
          #   * larger runners are billed even on public repositories, so paying
          #     GitHub buys a machine that still cannot hold the analysis.
    steps:
      # WHERE this build lands, decided once and read by the attach step.
      # A v* ref (a tag push, or a dispatch naming an existing tag) PUBLISHES:
      # the asset is attached to that tag's release, so a CI-only fix can still
      # reach a release already cut. A dispatch from a BRANCH is a DRY RUN — it
      # builds, stages and runs every smoke test, and publishes nothing. That
      # split is what makes the release build verifiable without spending a tag
      # on it; without it `tag_name` falls back to `main` and softprops CREATES
      # a release called main (walked into exactly that while proving the
      # runner gate).
      - name: Decide where this build lands
        id: target
        shell: bash
        run: |
          ref='${{ inputs.tag || github.ref_name }}'
          case "$ref" in
            v[0-9]*) echo 'publish=true' >> "$GITHUB_OUTPUT"; echo "attaching to $ref" ;;
            *) echo 'publish=false' >> "$GITHUB_OUTPUT"; echo "dry run on $ref: building and testing, publishing nothing" ;;
          esac
      # A dispatch may name an ALREADY-PUSHED tag: build that tag's source with
      # THIS (fixed) workflow file, and attach the asset to that tag's release —
      # otherwise a CI-only fix could never be applied to a release already cut.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # GraalVM COMMUNITY Edition (GPLv2 + Classpath Exception) — the SAME pinned
      # graalvm-ce-builds asset CI installs. Keeps Oracle GraalVM (GFTC) OUT of
      # the distributed binary, so the redistribution/license story stays FOSS.
      # Bump the version inside the action together with deps.edn's org.graalvm.*
      # pins — Truffle/SVM refuse mismatches.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
            ~/.vis/build-cache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      # community: full agent, model downloads on first use (lean binary).
      # GitHub's Linux runner ships ~4 GB of swap; back the 12-14 GB builder heap
      # with a real swapfile instead of letting the JVM die on GC overhead.
      - name: Enlarge builder swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Build native image
        env:
          # A dispatch may replace the measured matrix arguments for ONE run, and
          # `natural` hands the builder heap back to native-image (build.clj).
          VIS_NATIVE_EXTRA_ARGS: ${{ inputs.native_args || matrix.extra_args }}
          VIS_NATIVE_BUILDER_HEAP: ${{ inputs.builder_heap }}
          # setup-graalvm-25 installed the LOCKED pin (25.1.3). A mismatch here means
          # the setup step is broken; fail fast rather than SDKMAN-installing a JDK
          # in the middle of a 2 h release build.
          # Which distribution TRACK this binary belongs to, stamped INTO the
          # image and beside it (build.clj `build-stamp`). A tag build IS the
          # stable track; a branch dispatch publishes nothing, so it is marked
          # `dry-run` and can never pass for a shipped beta (the beta track has
          # its own workflow, beta-native.yml).
          VIS_RELEASE_TRACK: ${{ steps.target.outputs.publish == 'true' && 'stable' || 'dry-run' }}
          VIS_AUTO_INSTALL_GRAALVM: "0"
        run: clojure -T:build native
      # ONE definition of a release bundle, shared with `bin/release-native` so a
      # locally built asset and a CI asset cannot drift. It also fails hard when
      # the language-resources sidecar is missing — the image no longer embeds
      # the Python stdlib (-H:+CopyLanguageResources), so a binary shipped
      # without that directory has no working Python at all.
      - name: Stage wrapper bundle
        shell: bash
        run: bin/stage-release-bundle "${{ matrix.bin }}" "${{ matrix.asset }}"
      - name: Smoke-test the installed wrapper
        shell: bash
        run: target/release-bundle/vis-agent help >/dev/null
      - name: Smoke-test the language-resources sidecar
        shell: bash
        run: |
          set -euo pipefail
          out="$(target/release-bundle/vis-agent python -c "import ast; print('py-ok')")"
          [ "$out" = "py-ok" ] || { echo '::error::the staged language resources do not load'; exit 1; }
      # Deeper smoke: boot the gateway. A client command auto-spawns the DETACHED
      # gateway daemon, which builds the FULL reitit router from EVERY channel's
      # route contributions and does a real HTTP round-trip. A broken/conflicting
      # route table makes the daemon exit on startup and the client prints
      # "gateway daemon did not become ready" — a class of failure `help`
      # (in-process, no router) can never catch. Fail HERE rather than ship a
      # binary whose gateway (and thus every agent turn) can't run.
      - name: Smoke-test the gateway
        shell: bash
        run: |
          set -uo pipefail
          out="$(target/release-bundle/vis-agent providers status anthropic 2>&1 || true)"
          echo "$out"
          if printf '%s\n' "$out" | grep -q 'did not become ready'; then
            echo '::error::gateway daemon failed to boot — the route table is broken'
            exit 1
          fi
          target/release-bundle/vis-agent gateway stop >/dev/null 2>&1 || true
      # The binary's OWN suite (test-native/): the TUI's first frame on a pty and a
      # whole one-shot agent turn against a keyless loopback provider the suite
      # invents. Those paths exist only once native-image has linked the file, so
      # this is the only place they run.
      - name: Test the native binary
        shell: bash
        env:
          VIS_NATIVE_BIN: ${{ matrix.bin }}
        run: clojure -M:test-native
      - name: Attach to release
        if: steps.target.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          # A dispatched rebuild must land on the tag it was asked for, not on
          # the branch ref the dispatch ran from.
          tag_name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true

  # ── macOS arm64 ────────────────────────────────────────────────────────────
  # OUR OWN APPLE-SILICON RUNNER BUILDS THIS, by measurement, not taste.
  # native-image's points-to analysis holds a ~13.7 GiB live set. GitHub's
  # standard ARM64 macOS runner has 7 GiB RAM, and its paid M2 class has 14 GiB;
  # both remain below the analysis before the OS and linker are counted. The
  # standard runner either OOMed in minutes or, after shrinking the build, spent
  # 5 h 51 min in native-image before timing out (release v0.1.40).
  #
  # The self-hosted `vis-macos-arm64` runner is a 36 GiB, 14-core Apple-silicon
  # machine: it clears the measured live set, keeps the released binary on ARM64
  # and costs nothing per minute. It replaced a billed third-party macOS class,
  # which rented the same class of machine this project already owns.
  #
  # THAT MACHINE IS A WORKSTATION. A build pins every core and ~15 GiB for its
  # duration, so only STABLE tags route here; betas stay on free hosted Linux and
  # ship no macOS asset (see beta-native.yml).
  #
  # HOW THE RUNNER IS TARGETED. The runner must be registered and online, or an
  # exact label queues with nothing to take it. The optional `runner` dispatch
  # input and the VIS_MACOS_ARM64_RUNNER repository variable are explicit
  # overrides; with both unset this job always uses our own machine.
  # `macos-pickup` below catches an offline runner or an invalid override in
  # minutes instead of waiting 24 hours.
  #
  # Last resort, no runner at all: `bin/release-native --tag vX.Y.Z --upload`
  # by hand on any 24 GB+ Apple-silicon Mac produces the identical bundle.
  macos:
    name: native / vis-agent-macos-arm64-community.tar.gz
    if: inputs.only != 'linux'
    # Default to our own Apple-silicon runner; its 36 GiB clears the measured
    # analysis live set without routing any other macOS job there.
    runs-on: ${{ inputs.runner || vars.VIS_MACOS_ARM64_RUNNER || 'vis-macos-arm64' }}
    # The image takes ~13 min on a 32 GiB M-series builder. The 120 min cap still
    # hands a stalled runner back instead of holding it for 24 h.
    timeout-minutes: 120
    env:
      VIS_ASSET: vis-agent-macos-arm64-community.tar.gz
    steps:
      # The self-hosted runner's HOME is a person's real home, and this job caches
      # ~/.m2 and ~/.vis/build-cache and then RUNS the built binary. Give it a
      # scratch home under the runner's work root -- persistent, so the caches
      # still survive between releases -- and a release build can never disturb
      # the workstation's own ~/.vis.
      - name: Keep this build out of the runner's real home
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          home="$(dirname "$RUNNER_WORKSPACE")/ci-home"
          mkdir -p "$home"
          echo "HOME=$home" >> "$GITHUB_ENV"
      # WHERE this build lands, decided once and read by the attach step.
      # A v* ref (a tag push, or a dispatch naming an existing tag) PUBLISHES:
      # the asset is attached to that tag's release, so a CI-only fix can still
      # reach a release already cut. A dispatch from a BRANCH is a DRY RUN — it
      # builds, stages and runs every smoke test, and publishes nothing. That
      # split is what makes the release build verifiable without spending a tag
      # on it; without it `tag_name` falls back to `main` and softprops CREATES
      # a release called main (walked into exactly that while proving the
      # runner gate).
      - name: Decide where this build lands
        id: target
        shell: bash
        run: |
          ref='${{ inputs.tag || github.ref_name }}'
          case "$ref" in
            v[0-9]*) echo 'publish=true' >> "$GITHUB_OUTPUT"; echo "attaching to $ref" ;;
            *) echo 'publish=false' >> "$GITHUB_OUTPUT"; echo "dry run on $ref: building and testing, publishing nothing" ;;
          esac
      # The builder's own numbers, and the heap sized FROM them, are printed
      # before anything is downloaded so a failed run is diagnosable immediately.
      # Our own runner has 36 GiB, so build.clj sizes the heap from the
      # machine's RAM (0.6x, capped at 18g) with no workflow override.
      #
      # Under 16 GiB means an explicit `runner` override selected an undersized
      # macOS class. A heap above physical RAM is not viable on GitHub's 14 GiB
      # total disk, so this fallback shrinks the BUILD:
      #   --parallelism=2       fewer analysis threads, so less of the ~13.7 GiB
      #                         live set is resident at once (default: up to 32,
      #                         capped by cores)
      #   -J-Xmx5g -J-Xms1g     a heap that fits in RAM beside the OS
      #   -J-XX:GCTimeRatio=19  GraalVM's documented peak-RSS control
      #   -Ob                   quick build: much less builder memory, slower
      #                         binary; added on DRY RUNS only, so an override can
      #                         prove the runner without publishing that artifact
      # A dispatch may replace these arguments or set `builder_heap=natural` to
      # measure native-image's own untuned sizing on a selected runner.
      - name: Size the builder heap from the builder
        shell: bash
        run: |
          set -euo pipefail
          gib=$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))
          echo "builder: $(sysctl -n hw.ncpu) cores / ${gib} GiB / $(uname -m)"
          sysctl -n vm.swapusage || true
          df -h / /System/Volumes/Data 2>/dev/null || df -h /
          heap='${{ inputs.builder_heap }}'
          args='${{ inputs.native_args }}'
          if [ -n "$heap" ]; then echo "VIS_NATIVE_BUILDER_HEAP=$heap" >> "$GITHUB_ENV"; fi
          if [ -z "$args" ] && [ -z "$heap" ] && [ "$gib" -lt 16 ]; then
            args='--parallelism=2 -J-Xmx5g -J-Xms1g -J-XX:GCTimeRatio=19 -H:DeadlockWatchdogInterval=0'
            if [ '${{ steps.target.outputs.publish }}' != 'true' ]; then
              args="$args -Ob"
            fi
            echo "low-memory builder under the ~13.7 GiB live set: $args"
          fi
          if [ -n "$args" ]; then echo "VIS_NATIVE_EXTRA_ARGS=$args" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      # Piper uses espeak-ng's phoneme tables. A clean macOS image does not
      # preinstall them, so make the native suite dependency explicit; brew is a
      # no-op on a runner that already has it.
      - name: Install native test dependencies
        run: brew install espeak-ng
      # A hosted runner is ephemeral and a self-hosted one builds under a scratch
      # HOME, so persist the dependency and build caches either way: no release
      # should download and reconstruct the whole tree.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
            ~/.vis/build-cache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Build native image
        env:
          # Which distribution TRACK this binary belongs to, stamped INTO the
          # image and beside it (build.clj `build-stamp`). A tag build IS the
          # stable track; a branch dispatch publishes nothing, so it is marked
          # `dry-run` and can never pass for a shipped beta (the beta track has
          # its own workflow, beta-native.yml).
          VIS_RELEASE_TRACK: ${{ steps.target.outputs.publish == 'true' && 'stable' || 'dry-run' }}
          VIS_AUTO_INSTALL_GRAALVM: "0"
        run: clojure -T:build native
      - name: Stage wrapper bundle
        shell: bash
        run: bin/stage-release-bundle target/vis "$VIS_ASSET"
      - name: Smoke-test the installed wrapper
        shell: bash
        run: target/release-bundle/vis-agent help >/dev/null
      - name: Smoke-test the language-resources sidecar
        shell: bash
        run: |
          set -euo pipefail
          out="$(target/release-bundle/vis-agent python -c "import ast; print('py-ok')")"
          [ "$out" = "py-ok" ] || { echo '::error::the staged language resources do not load'; exit 1; }
      # The binary's OWN suite (test-native/): the TUI's first frame on a pty and a
      # whole one-shot agent turn against a keyless loopback provider the suite
      # invents. Those paths exist only once native-image has linked the file, so
      # this is the only place they run.
      # Same deeper smoke as the matrix job: boot the DETACHED gateway daemon so a
      # broken/conflicting route table fails here instead of shipping.
      - name: Smoke-test the gateway
        shell: bash
        run: |
          set -uo pipefail
          out="$(target/release-bundle/vis-agent providers status anthropic 2>&1 || true)"
          echo "$out"
          if printf '%s\n' "$out" | grep -q 'did not become ready'; then
            echo '::error::gateway daemon failed to boot — the route table is broken'
            exit 1
          fi
          target/release-bundle/vis-agent gateway stop >/dev/null 2>&1 || true
      - name: Test the native binary
        shell: bash
        env:
          VIS_NATIVE_BIN: target/vis
        run: clojure -M:test-native
      - name: Attach to release
        if: steps.target.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.VIS_ASSET }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true

  # ── macOS runner pickup guard ──────────────────────────────────────────────
  # An offline or busy runner, a misspelled override, or a label no machine
  # carries leaves the job queued, and GitHub waits up to 24 h before failing it.
  # Watch from an unrelated free Linux runner and report the routing problem while
  # the release can still be re-dispatched. This does not cancel a late build; if
  # the runner comes back, the asset may still attach.
  macos-pickup:
    name: native / macOS builder pickup
    if: inputs.only != 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # `contents: write` at the top of this file REPLACES the default token
      # scopes, so reading the job list of this very run must be asked for.
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Read through env, never interpolated into the script: a dispatch input
      # is attacker-shaped text and `run:` would evaluate it.
      MACOS_RUNNER: ${{ inputs.runner || vars.VIS_MACOS_ARM64_RUNNER || 'vis-macos-arm64' }}
      TARGET_REF: ${{ inputs.tag || github.ref_name }}
      DEADLINE_MINUTES: "25"
    steps:
      - name: Fail fast when no macOS builder takes the job
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + DEADLINE_MINUTES * 60 ))
          while :; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
                        --jq '[.jobs[] | select(.name | endswith("macos-arm64-community.tar.gz"))][0].status // "unlisted"')"
            case "$status" in
              in_progress|completed)
                echo "${MACOS_RUNNER} took the macOS build (${status})"
                exit 0
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No runner labelled ${MACOS_RUNNER} started the macOS build within ${DEADLINE_MINUTES} min, so ${TARGET_REF} is heading for a release with no macOS asset. Check that the Apple-silicon runner is registered, online and idle in this repository's runner list, then re-dispatch with tag=${TARGET_REF} only=macos; use runner=<Apple-silicon label> only for an intentional override."
              exit 1
            fi
            sleep 15
          done
