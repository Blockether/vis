name: Release & Deploy to Clojars

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify tag, main, and VIS_VERSION are identical
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(tr -d '[:space:]' < VIS_VERSION)"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
      - name: Prepare unpublished release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["draft"], "Published releases are immutable"' "$RUNNER_TEMP/release.json"
            gh release upload "$RELEASE_TAG" bin/install-vis-agent bin/vis-agent --clobber
          else
            gh release create "$RELEASE_TAG" bin/install-vis-agent bin/vis-agent \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi

  native:
    needs: prepare
    uses: ./.github/workflows/native-release.yml
    with:
      tag: ${{ github.ref_name }}
      only: all
    secrets: inherit

  mobile:
    needs: prepare
    uses: ./.github/workflows/mobile-release.yml
    with:
      platforms: both
      track: all
      audience: all
      require_complete: true
    secrets: inherit

  desktop:
    needs: prepare
    uses: ./.github/workflows/desktop-companion.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Verify complete assets, deploy libraries and publish stable
    needs: [prepare, native, mobile, desktop]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Require every verified product artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          python3 bin/verify-release-assets.py "$RUNNER_TEMP/release.json" "$RELEASE_TAG"
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Deploy monorepo packages to Clojars
        env:
          CLOJARS_USERNAME: blockether-deployer
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://repo.clojars.org/com/blockether/vis/$VERSION/vis-$VERSION.jar")
          case "$STATUS" in
            200) echo "Version $VERSION already deployed; resuming draft publication" ;;
            404) clojure -X:deps prep && clojure -T:build deploy ;;
            *) echo "Cannot verify Clojars version (HTTP $STATUS)" >&2; exit 1 ;;
          esac
      - name: Publish complete stable release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  installer:
    needs: publish
    uses: ./.github/workflows/installer-assets.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
