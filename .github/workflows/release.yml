name: Release & Deploy to Clojars

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished vX.Y.Z tag to recover without moving it
        type: string
        required: true
      source_run:
        description: Original release run with green source, macOS, mobile and desktop checks
        type: string
        required: true
      native_run:
        description: Successful Linux recovery run from native-release.yml for the same tag
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    needs: prepare
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  prepare:
    # Validate main before slow CI; artifact jobs still require all source checks.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify tag, main, and VIS_VERSION are identical
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(tr -d '[:space:]' < VIS_VERSION)"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
      - name: Prepare unpublished release
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
      - uses: ./.github/actions/require-draft-release
        with:
          tag: ${{ github.ref_name }}
      - name: Upload installers to the verified draft
        run: gh release upload "$RELEASE_TAG" bin/install-vis-agent bin/vis-agent --clobber

  native:
    needs: [prepare, verify]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/native-release.yml
    with:
      tag: ${{ github.ref_name }}
      only: all
    secrets: inherit

  mobile:
    needs: [prepare, verify]
    uses: ./.github/workflows/mobile-release.yml
    with:
      platforms: both
      track: all
      audience: all
      require_complete: true
    secrets: inherit

  desktop:
    needs: [prepare, verify]
    uses: ./.github/workflows/desktop-companion.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  recover:
    name: Verify original product gates and repaired Linux checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.source_run }}
      NATIVE_RUN: ${{ inputs.native_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/require-draft-release
        id: release
        with:
          tag: ${{ inputs.tag }}
      - name: Verify recovery without moving the tag or resubmitting mobile builds
        id: verify
        env:
          RELEASE_METADATA: ${{ steps.release.outputs.metadata }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" HEAD
          test "$RELEASE_TAG" = "v$(git show "$sha:VIS_VERSION" | tr -d '[:space:]')"
          python3 bin/verify-release-assets.py "$RELEASE_METADATA" "$RELEASE_TAG" \
            --source-run "$SOURCE_RUN" --native-run "$NATIVE_RUN" --sha "$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Verify complete assets, deploy libraries and publish stable
    needs: [prepare, native, mobile, desktop, recover]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && needs.prepare.result == 'success' &&
        needs.native.result == 'success' && needs.mobile.result == 'success' &&
        needs.desktop.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.recover.result == 'success'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.recover.outputs.sha || github.sha }}
      - uses: ./.github/actions/require-draft-release
        id: release
        with:
          tag: ${{ inputs.tag || github.ref_name }}
      - name: Require every verified product artifact
        env:
          RELEASE_METADATA: ${{ steps.release.outputs.metadata }}
        run: python3 bin/verify-release-assets.py "$RELEASE_METADATA" "$RELEASE_TAG"
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Deploy monorepo packages to Clojars
        env:
          CLOJARS_USERNAME: blockether-deployer
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://repo.clojars.org/com/blockether/vis/$VERSION/vis-$VERSION.jar")
          case "$STATUS" in
            200) echo "Version $VERSION already deployed; resuming draft publication" ;;
            404) clojure -X:deps prep && clojure -T:build deploy ;;
            *) echo "Cannot verify Clojars version (HTTP $STATUS)" >&2; exit 1 ;;
          esac
      - name: Publish complete stable release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
