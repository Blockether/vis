name: Release & Deploy to Clojars

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release & Deploy to Clojars

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags and changelog history
        run: |
          git fetch --tags --no-recurse-submodules origin
          git fetch --deepen=200 origin main

      - name: Verify tag, main, and VIS_VERSION are identical
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VIS_VERSION)
          EXPECTED="v$VERSION"
          test "$GITHUB_REF_NAME" = "$EXPECTED" || {
            echo "$GITHUB_REF_NAME does not match VIS_VERSION=$VERSION (expected $EXPECTED)" >&2
            exit 1
          }
          TAG_COMMIT=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)" || {
            echo "$GITHUB_REF_NAME must point at current main before release" >&2
            exit 1
          }

      # Jars deployed to Clojars are built on the SAME locked JDK as everything
      # else (GraalVM CE 25.1.3, .graalvm-version) — the action also refuses a
      # half-bumped/unlocked pin before anything is published.
      - uses: ./.github/actions/setup-graalvm-25

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'extensions/**/deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 2 | tail -n 1)
          CURRENT_TAG=${{ github.ref_name }}
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi

          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $RANGE)

          package_changes() {
            local any=false
            echo "### Package changes"
            echo ""

            local root_entries
            root_entries=$(git log --pretty=format:"- %s (%h)" $RANGE -- . ':(exclude)extensions' || true)
            if [ -n "$root_entries" ]; then
              any=true
              echo "#### com.blockether/vis"
              echo "$root_entries"
              echo ""
            fi

            while IFS= read -r deps_file; do
              local dir short lib entries
              dir="${deps_file%/deps.edn}"
              short=$(basename "$dir")
              lib="com.blockether/$short"
              entries=$(git log --pretty=format:"- %s (%h)" $RANGE -- "$dir" || true)
              if [ -n "$entries" ]; then
                any=true
                echo "#### $lib"
                echo "$entries"
                echo ""
              fi
            done < <(find extensions -mindepth 2 -maxdepth 3 -name deps.edn -print | sort)

            if [ "$any" = false ]; then
              echo "- No package-scoped changes."
              echo ""
            fi
          }

          package_changes > /tmp/package_changes.md

          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGELOG"
            echo ""
            cat /tmp/package_changes.md
            echo "**Full Changelog**: https://github.com/Blockether/vis/compare/${PREV_TAG}...${CURRENT_TAG}"
          } > /tmp/release_body.md

      # The documented one-liner is an asset of the ROLLING `installer` release
      # (releases/download/installer/install-vis-agent, refreshed by
      # installer-assets.yml on every commit that touches these scripts), because
      # raw.githubusercontent.com is blocked on many corporate networks while
      # github.com release downloads are not. Every version release keeps its own
      # snapshot of the same two scripts, so releases/latest/download/... — the
      # URL already in the wild — never stops working. They only bootstrap: what
      # they install is never a tag, it is the branch tip, since a published
      # release can carry broken source. native-release.yml attaches the platform
      # bundles to this same release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release_body.md
          files: |
            bin/install-vis-agent
            bin/vis-agent
          fail_on_unmatched_files: true

      - name: Check if version exists on Clojars
        id: check-clojars
        shell: bash
        run: |
          set -euo pipefail
          # The monorepo publishes com.blockether/vis plus every package discovered
          # from extensions/**/deps.edn. Probe the root vis jar as the bellwether —
          # every release deploys the full selected package set together.
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://repo.clojars.org/com/blockether/vis/$VERSION/vis-$VERSION.jar")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION already exists on Clojars - skipping deploy"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Deploy monorepo packages to Clojars
        if: steps.check-clojars.outputs.exists != 'true'
        env:
          VIS_VERSION: ${{ github.ref_name }}
          CLOJARS_USERNAME: blockether-deployer
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy

      - name: Stamp the published Clojars version in the docs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/{:mvn\/version \"[^\"]*\"}/{:mvn\/version \"$VERSION\"}/g" README.md resources/vis-docs/index.md

      - name: Update CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 2 | tail -n 1)
          CURRENT_TAG=${{ github.ref_name }}
          DATE=$(date +%Y-%m-%d)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi
          COMMITS=$(git log --pretty=format:"- %s" $RANGE)
          if [ ! -f /tmp/package_changes.md ]; then
            echo "### Package changes" > /tmp/package_changes.md
            echo "" >> /tmp/package_changes.md
            echo "- Package change details were unavailable for this release run." >> /tmp/package_changes.md
          fi
          UNRELEASED_LINE=$(grep -n '^## \[Unreleased\]' CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$UNRELEASED_LINE" ]; then
            echo "ERROR: Could not find ## [Unreleased] section in CHANGELOG.md"
            exit 1
          fi
          {
            head -n "$UNRELEASED_LINE" CHANGELOG.md
            echo ""
            echo "## [$CURRENT_TAG] - $DATE"
            echo ""
            echo "### Changed"
            echo "$COMMITS"
            echo ""
            cat /tmp/package_changes.md
            echo ""
            tail -n +$((UNRELEASED_LINE + 1)) CHANGELOG.md
          } > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
          sed -i "s|\[Unreleased\]: .*|[Unreleased]: https://github.com/Blockether/vis/compare/${CURRENT_TAG}...HEAD|" CHANGELOG.md
          if ! grep -q "^\[${CURRENT_TAG}\]:" CHANGELOG.md; then
            echo "[$CURRENT_TAG]: https://github.com/Blockether/vis/releases/tag/${CURRENT_TAG}" >> CHANGELOG.md
          fi

      - name: Commit release notes
        run: |
          set -euo pipefail
          git config user.name "blockether-deployer"
          git config user.email "contact@blockether.com"
          git add README.md CHANGELOG.md resources/vis-docs/index.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "release: update release notes for ${{ github.ref_name }}"
          # main can move while the release runs — another push landing first used to
          # reject this push and fail a release that had ALREADY published the tag, the
          # GitHub Release and the Clojars artifacts, which also skipped the mobile job.
          # Rebase the notes commit onto the new main and retry instead.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing release notes onto origin/main"
            git fetch --no-recurse-submodules origin main
            git rebase origin/main
          done
          echo "could not push release notes after 5 attempts" >&2
          exit 1

  mobile:
    name: Release matching iOS and Android apps
    needs: release
    uses: ./.github/workflows/mobile-release.yml
    with:
      platforms: both
      track: beta
      public: true
    secrets: inherit
