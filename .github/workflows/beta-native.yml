name: Beta Native

# Successful main CI starts the same native and desktop builds used for production
# releases. Each beta has an immutable tag. Drafts never become installation
# candidates until every native target, bundled worker, SDK check, terminal client
# and desktop installer has passed. A published beta then dispatches python-publish.yml,
# which puts the SDK that the beta bundles on PyPI as a development release.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: beta-native-pick-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  pick:
    name: prepare a beta from green main CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Choose and verify the exact CI commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          green_main="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            -q '.workflow_runs[0].head_sha // empty')"
          if [ -z "$green_main" ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No successful main CI exists'
            exit 0
          fi
          sha="${EVENT_SHA:-$green_main}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid commit'; exit 1; }
          # Beta Native 36531710443: the filtered run list can name an older green commit,
          # and an older commit never supersedes this one.
          if [ "$sha" != "$green_main" ] &&
            [ "$(gh api "repos/$REPO/compare/$sha...$green_main" -q .status)" != behind ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer successful main CI superseded this run'
            exit 0
          fi
          green="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100" \
            -q "[.workflow_runs[] | select(.head_sha == \"$sha\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")] | length")"
          if [ "$green" -lt 1 ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No successful main CI exists for this exact commit'
            exit 0
          fi
          tag="beta-$sha"
          # Draft releases do not create a Git ref for the native jobs to check out.
          if ! gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
          fi
          [ "$(gh api "repos/$REPO/commits/$tag" -q .sha)" = "$sha" ]
          draft="$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            -q ".[] | select(.tag_name == \"$tag\") | .draft")"
          if [ -n "$draft" ]; then
            if [ "$draft" = false ]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo '::notice::This immutable beta is already published'
              exit 0
            fi
            [ "$draft" = true ]
          else
            gh release create "$tag" --repo "$REPO" --target "$sha" \
              --draft --prerelease --latest=false --title "Beta ${sha:0:12}" \
              --notes "Native beta from green main CI at $sha. Install: vis-agent update --track beta. Desktop: vis-agent desktop --track beta, or an installer below. Return to production: vis-agent update --track release."
          fi
          [ "$(gh api "repos/$REPO/commits/$tag" -q .sha)" = "$sha" ]
          printf 'sha=%s\ntag=%s\nbuild=true\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"

  native:
    concurrency:
      group: beta-native-builds
      cancel-in-progress: true
    needs: pick
    if: needs.pick.outputs.build == 'true'
    uses: ./.github/workflows/native-release.yml
    with:
      tag: ${{ needs.pick.outputs.tag }}
    secrets: inherit

  # Installers for every desktop platform, attached to the same draft.
  desktop:
    concurrency:
      group: beta-desktop-builds
      cancel-in-progress: true
    needs: pick
    if: needs.pick.outputs.build == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/desktop-companion.yml
    with:
      tag: ${{ needs.pick.outputs.tag }}
    secrets: inherit

  publish:
    name: publish only the complete native beta
    needs: [pick, native, desktop]
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pick.outputs.sha }}
      - uses: ./.github/actions/require-draft-release
        id: draft
        with:
          tag: ${{ needs.pick.outputs.tag }}
      - name: Verify all native assets and publish the immutable prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.pick.outputs.sha }}
          TAG: ${{ needs.pick.outputs.tag }}
          METADATA: ${{ steps.draft.outputs.metadata }}
        run: |
          set -euo pipefail
          [ "$(gh api "repos/$REPO/commits/$TAG" -q .sha)" = "$SHA" ]
          green_main="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            -q '.workflow_runs[0].head_sha // empty')"
          # The same run list can name an older green commit, which never supersedes this beta.
          if [ "$green_main" != "$SHA" ] &&
            [ "$(gh api "repos/$REPO/compare/$SHA...$green_main" -q .status)" != behind ]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer successful main CI superseded this beta; leaving its draft unpublished'
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          with open(os.environ['METADATA']) as source:
              release = json.load(source)
          # desktop-package.mjs names installers after VIS_VERSION without its qualifier.
          with open('VIS_VERSION') as source:
              version = source.read().strip().split('-')[0]
          expected = {f'{name}-{platform}.tar.gz'
                      for name in ('vis-agent', 'vis-tui')
                      for platform in ('linux-x64', 'linux-arm64', 'macos-arm64')}
          expected.add('vis-web.tar.gz')
          expected.update(f'vis-companion-{version}-{installer}'
                          for installer in ('macos-universal.dmg', 'windows-x64.msi',
                                            'linux-x64.deb', 'linux-x64.AppImage',
                                            'linux-arm64.deb', 'linux-arm64.AppImage'))
          assets = release['assets']
          assert release['draft'] is True and release['tag_name'] == os.environ['TAG']
          assert release['prerelease'] is True
          assert len(assets) == len(expected)
          assert {asset['name'] for asset in assets} == expected
          assert all(asset['size'] > 0 and asset['state'] == 'uploaded' for asset in assets)
          PY
          gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false
          echo 'published=true' >> "$GITHUB_OUTPUT"

  index:
    name: select the published native beta for installers
    needs: [pick, publish]
    # Only the publish job decides whether this beta is still current. A second CI
    # query can see a different latest run and select a beta left as a draft.
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: beta-native-index
      cancel-in-progress: false
    steps:
      - name: Record the latest complete native beta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.pick.outputs.sha }}
          TAG: ${{ needs.pick.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$TAG" = "beta-$SHA" ]
          [ "$(gh api "repos/$REPO/releases/tags/$TAG" -q '.draft == false and .prerelease == true')" = true ]
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/native-beta"
          gh release upload installer "$RUNNER_TEMP/native-beta" --repo "$REPO" --clobber

  sdk:
    name: publish the bundled SDK of the beta to PyPI
    needs: [pick, publish]
    # A separate job: a failed dispatch must not keep installers from the published beta.
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # dispatch python-publish.yml
    steps:
      - name: Dispatch the trusted PyPI publisher
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.pick.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^beta-[0-9a-f]{40}$ ]]
          # PyPI trusts only python-publish.yml as a top-level workflow; it derives the version.
          gh workflow run python-publish.yml --repo "$REPO" --ref main -f release_tag="$TAG"
