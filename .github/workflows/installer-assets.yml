name: Installer assets

# Keep track selection available without waiting for a product release.
# Native installs still replace the bootstrap with the matching release launcher.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: installer-assets
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select the latest successful main CI commit
        id: pick
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          green_main="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            -q ".workflow_runs[0] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\") | .head_sha // empty")"
          if [ -z "$green_main" ]; then
            echo '::notice::No successful main CI exists'
            exit 0
          fi
          sha="${EVENT_SHA:-$green_main}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid commit'; exit 1; }
          if [ "$sha" != "$green_main" ]; then
            echo '::notice::A newer successful main CI superseded this bootstrap'
            exit 0
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.pick.outputs.sha != ''
        with:
          ref: ${{ steps.pick.outputs.sha }}
          persist-credentials: false
      - name: Refresh both bootstrap assets without moving a tag
        if: steps.pick.outputs.sha != ''
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          notes="Bootstrap scripts from green main CI at $SHA. Installs the latest complete stable native release by default; --track beta selects native betas, --track dev selects JVM source."
          if gh release view installer >/dev/null 2>&1; then
            gh release upload installer bin/install-vis-agent bin/vis-agent --clobber
            gh release edit installer --prerelease --latest=false --title 'Installer' --notes "$notes"
          else
            gh release create installer bin/install-vis-agent bin/vis-agent \
              --prerelease --latest=false --target "$SHA" \
              --title 'Installer' --notes "$notes"
          fi
