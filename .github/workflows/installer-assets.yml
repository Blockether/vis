name: Installer assets

# Refresh the documented rolling bootstrap only after a complete stable release.
# The installer tag is never moved; the versioned release remains immutable.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Current complete stable release tag
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: installer-assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Require the latest complete stable release
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"
          python3 bin/verify-release-assets.py "$RUNNER_TEMP/release.json" "$RELEASE_TAG" --published
      - name: Refresh both bootstrap assets without moving a tag
        run: |
          set -euo pipefail
          notes="Bootstrap scripts from complete stable release $RELEASE_TAG. Installs the native engine, Python runtime and terminal client; source development requires --jvm."
          if gh release view installer >/dev/null 2>&1; then
            gh release upload installer bin/install-vis-agent bin/vis-agent --clobber
            gh release edit installer --prerelease --latest=false --title 'Installer (stable)' --notes "$notes"
          else
            gh release create installer bin/install-vis-agent bin/vis-agent \
              --prerelease --latest=false --target "$(git rev-parse HEAD)" \
              --title 'Installer (stable)' --notes "$notes"
          fi
