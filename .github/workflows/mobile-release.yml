name: Mobile release

# Signed companion distribution uses the existing TestFlight and Play tester tracks.
# A regular release requires both stores and attaches both signed packages to its
# unpublished draft. Missing credentials or a publish freeze block that release.
# App-only tags and manual runs retain their explicitly selected platform scope.
# Both legs ask for `all`, which each store resolves against ITSELF at release time:
#   iOS      → TestFlight; every tester audience — every internal group AND the external
#              PUBLIC-LINK group after Beta App Review (the analogue of Play's `beta`)
#   Android  → Google Play; every TESTER track the listing HAS, in one edit — internal, alpha,
#              beta (which IS the public "Open testing" channel) and any closed track created
#              in the Play Console. `production` is never implied; name it to ship the store.
# So a tester group or closed track added in a console is served by the next run of this
# workflow with no change here.
#
# Android publishing can be frozen in scripts/android-publish-freeze.mjs.
# Optional app-only runs may skip it; complete product releases must fail closed.
#
# Store build logic stays in scripts/{ios-release,android-release}.mjs. Public
# npm release commands only orchestrate the regular/companion tag contract;
# CI calls the explicit `release:ios:store` / `release:android:store` internals.
#
# Repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   iOS      VIS_ASC_KEY_ID, VIS_ASC_ISSUER_ID, VIS_ASC_KEY (the .p8 CONTENTS), VIS_IOS_TEAM_ID,
#            VIS_IOS_DISTRIBUTION_P12 (base64 .p12), VIS_IOS_DISTRIBUTION_P12_PASSWORD,
#            Profiles are NOT secrets: release:ios:store asks the App Store Connect API for the
#            ACTIVE App Store profile of every bundle id on each run and installs it, so a stored
#            .mobileprovision could only rot and shadow the live one.
#   Android  VIS_PLAY_SERVICE_ACCOUNT (service-account JSON), VIS_ANDROID_KEYSTORE (base64 .jks),
#            VIS_ANDROID_KEYSTORE_PASSWORD, VIS_ANDROID_KEY_ALIAS, VIS_ANDROID_KEY_PASSWORD,
#            VIS_ANDROID_GOOGLE_SERVICES (google-services.json, optional — push only)
# Export what you already hold locally:
#   cd apps/vis-companion && npm run secrets export-keystore | base64   # VIS_ANDROID_KEYSTORE
#
# Missing signing credentials may skip optional app-only runs, never a complete release.

on:
  push:
    tags: ['companion-v*']
  workflow_call:
    inputs:
      platforms:
        type: string
        default: both
      track:
        type: string
        default: all
      audience:
        type: string
        default: all
      require_complete:
        description: Require both signed packages and attach them to the calling draft release
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platforms:
        description: Which stores to ship to
        type: choice
        options: [both, ios, android]
        default: both
      track:
        description: "Play tracks — all = every tester track this listing has (never production)"
        type: choice
        options: [all, 'internal,alpha,beta', internal, alpha, beta, production]
        default: all
      audience:
        description: "TestFlight audiences — all = every internal group AND the public link (Beta App Review)"
        type: choice
        options: [all, internal]
        default: all

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/vis-companion

jobs:
  # Whether Android may publish at all is decided in ONE file, read by this workflow and by
  # the local release scripts: apps/vis-companion/scripts/android-publish-freeze.mjs. The
  # gate never fails — a frozen store skips the job below and iOS ships alone.
  android-gate:
    name: Android publish freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.freeze.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - id: freeze
        run: node scripts/android-publish-freeze.mjs --github-output
      - name: Require Android publication for a complete release
        if: inputs.require_complete && steps.freeze.outputs.android != 'allowed'
        run: echo '::error::Complete release blocked by Android publish freeze'; exit 1
  ios:
    # A tag ships to TestFlight; a manual run only when iOS was asked for.
    if: ${{ github.event_name == 'push' || inputs.platforms != 'android' }}
    # The self-hosted Apple-silicon builder must have Xcode 26+ (iOS 26 SDK).
    runs-on: [self-hosted, macOS, ARM64, vis-macos-arm64]
    timeout-minutes: 90
    steps:
      # Version code is `git rev-list --count HEAD`, so a shallow clone would produce a
      # LOWER build number than the previous release and App Store Connect would reject it.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/require-draft-release
        if: inputs.require_complete
        with:
          tag: ${{ github.ref_name }}
      - name: Verify release lineage and VIS_VERSION
        run: |
          set -euo pipefail

          VERSION=$(tr -d '[:space:]' < ../../VIS_VERSION)
          REGULAR="v$VERSION"
          REGULAR_COMMIT=$(git rev-parse --verify "$REGULAR^{commit}") || {
            echo "$REGULAR must exist before releasing its companion" >&2
            exit 1
          }

          if [ "${{ github.event_name }}" = push ]; then
            case "$GITHUB_REF_NAME" in
              v*)
                test "$GITHUB_REF_NAME" = "$REGULAR" || {
                  echo "$GITHUB_REF_NAME does not match VIS_VERSION=$VERSION (expected $REGULAR)" >&2
                  exit 1
                }
                ;;
              companion-v"$VERSION"-build.*)
                EXPECTED="companion-v$VERSION-build.$(git rev-list --count HEAD)"
                test "$GITHUB_REF_NAME" = "$EXPECTED" || {
                  echo "$GITHUB_REF_NAME does not match the build number at HEAD (expected $EXPECTED)" >&2
                  exit 1
                }
                ;;
              *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi

          git merge-base --is-ancestor "$REGULAR_COMMIT" HEAD || {
            echo "$REGULAR must be an ancestor of this companion release" >&2
            exit 1
          }
          if [ "${GITHUB_REF_NAME:-}" = "$REGULAR" ]; then
            test "$REGULAR_COMMIT" = "$(git rev-parse HEAD)" || {
              echo "$REGULAR must point at the exact regular-release commit" >&2
              exit 1
            }
          fi

      # RUNNER_TEMP is cleaned between jobs; never upload the persistent npm cache.
      - name: Use job-local npm cache
        run: echo "npm_config_cache=$RUNNER_TEMP/vis-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Have credentials?
        id: creds
        env:
          KEY: ${{ secrets.VIS_ASC_KEY }}
        run: echo "ok=${{ env.KEY != '' }}" >> "$GITHUB_OUTPUT"

      # xcodebuild and altool both insist on a FILE. Keep it in RUNNER_TEMP with 0600, never in
      # the workspace where an artifact upload could catch it; the restore step below deletes it.
      - name: Materialise the App Store Connect key
        if: steps.creds.outputs.ok == 'true'
        env:
          VIS_ASC_KEY: ${{ secrets.VIS_ASC_KEY }}
        run: |
          umask 077
          printf '%s\n' "$VIS_ASC_KEY" > "$RUNNER_TEMP/AuthKey_${{ secrets.VIS_ASC_KEY_ID }}.p8"

      # App Store Connect API auth can fetch profiles, but hosted runners do not
      # arrive with a signing identity. Import the dedicated distribution
      # certificate into a temporary keychain owned by this job.
      - name: Install the iOS distribution certificate
        id: keychain
        if: steps.creds.outputs.ok == 'true'
        env:
          P12_BASE64: ${{ secrets.VIS_IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.VIS_IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" || { echo 'VIS_IOS_DISTRIBUTION_P12 is required' >&2; exit 1; }
          test -n "$P12_PASSWORD" || { echo 'VIS_IOS_DISTRIBUTION_P12_PASSWORD is required' >&2; exit 1; }
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/vis-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vis-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security list-keychain -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$RUNNER_TEMP/vis-keychains-before"
          security default-keychain -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$RUNNER_TEMP/vis-default-keychain-before"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Keep the runner login keychain searchable while signing.
          keychains=()
          while IFS= read -r keychain; do keychains+=("$keychain"); done < "$RUNNER_TEMP/vis-keychains-before"
          security list-keychain -d user -s "$KEYCHAIN_PATH" ${keychains[@]+"${keychains[@]}"}
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          printf 'path=%s\n' "$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Build, upload, distribute
        if: steps.creds.outputs.ok == 'true'
        env:
          VIS_ASC_KEY_ID: ${{ secrets.VIS_ASC_KEY_ID }}
          VIS_ASC_ISSUER_ID: ${{ secrets.VIS_ASC_ISSUER_ID }}
          VIS_IOS_TEAM_ID: ${{ secrets.VIS_IOS_TEAM_ID }}
          VIS_IOS_SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: |
          export VIS_ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${VIS_ASC_KEY_ID}.p8"
          npm run release:ios:store -- --audience ${{ inputs.audience || 'all' }}

      - name: Attach signed iOS package to the draft
        if: inputs.require_complete && steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < ../../VIS_VERSION)
          BUILD=$(git rev-list --count HEAD)
          shopt -s nullglob
          packages=(build/ios/export-"$VERSION"-"$BUILD"/*.ipa)
          test "${#packages[@]}" = 1
          mkdir -p build/release
          asset="build/release/vis-companion-$VERSION-ios.ipa"
          cp "${packages[0]}" "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
      # Restore persistent runner state even when certificate import fails midway.
      - name: Restore the runner keychain state
        if: always()
        run: |
          set +e
          if [ -s "$RUNNER_TEMP/vis-default-keychain-before" ]; then
            IFS= read -r keychain < "$RUNNER_TEMP/vis-default-keychain-before"
            security default-keychain -d user -s "$keychain"
          fi
          if [ -s "$RUNNER_TEMP/vis-keychains-before" ]; then
            keychains=()
            while IFS= read -r keychain; do keychains+=("$keychain"); done < "$RUNNER_TEMP/vis-keychains-before"
            security list-keychain -d user -s "${keychains[@]}"
          fi
          if [ -f "$RUNNER_TEMP/vis-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/vis-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/vis-distribution.p12" "$RUNNER_TEMP"/AuthKey_*.p8 \
                "$RUNNER_TEMP/vis-keychains-before" "$RUNNER_TEMP/vis-default-keychain-before"

      - name: No iOS credentials
        if: steps.creds.outputs.ok != 'true'
        env:
          REQUIRE_COMPLETE: ${{ inputs.require_complete }}
        run: |
          if [ "$REQUIRE_COMPLETE" = true ]; then
            echo '::error::Complete release requires iOS signing credentials'; exit 1
          fi
          echo '::notice::VIS_ASC_KEY is not set — skipping the TestFlight upload'

  android:
    needs: android-gate
    if: ${{ needs.android-gate.outputs.android == 'allowed' && (github.event_name == 'push' || inputs.platforms != 'ios') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/require-draft-release
        if: inputs.require_complete
        with:
          tag: ${{ github.ref_name }}
      - name: Verify release lineage and VIS_VERSION
        run: |
          set -euo pipefail

          VERSION=$(tr -d '[:space:]' < ../../VIS_VERSION)
          REGULAR="v$VERSION"
          REGULAR_COMMIT=$(git rev-parse --verify "$REGULAR^{commit}") || {
            echo "$REGULAR must exist before releasing its companion" >&2
            exit 1
          }

          if [ "${{ github.event_name }}" = push ]; then
            case "$GITHUB_REF_NAME" in
              v*)
                test "$GITHUB_REF_NAME" = "$REGULAR" || {
                  echo "$GITHUB_REF_NAME does not match VIS_VERSION=$VERSION (expected $REGULAR)" >&2
                  exit 1
                }
                ;;
              companion-v"$VERSION"-build.*)
                EXPECTED="companion-v$VERSION-build.$(git rev-list --count HEAD)"
                test "$GITHUB_REF_NAME" = "$EXPECTED" || {
                  echo "$GITHUB_REF_NAME does not match the build number at HEAD (expected $EXPECTED)" >&2
                  exit 1
                }
                ;;
              *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi

          git merge-base --is-ancestor "$REGULAR_COMMIT" HEAD || {
            echo "$REGULAR must be an ancestor of this companion release" >&2
            exit 1
          }
          if [ "${GITHUB_REF_NAME:-}" = "$REGULAR" ]; then
            test "$REGULAR_COMMIT" = "$(git rev-parse HEAD)" || {
              echo "$REGULAR must point at the exact regular-release commit" >&2
              exit 1
            }
          fi

      # RUNNER_TEMP is cleaned between jobs; never upload the persistent npm cache.
      - name: Use job-local npm cache
        run: echo "npm_config_cache=$RUNNER_TEMP/vis-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Have credentials?
        id: creds
        env:
          SA: ${{ secrets.VIS_PLAY_SERVICE_ACCOUNT }}
          KS: ${{ secrets.VIS_ANDROID_KEYSTORE }}
        run: echo "ok=${{ env.SA != '' && env.KS != '' }}" >> "$GITHUB_OUTPUT"

      # Every credential goes in through the environment, exactly as the local keychain
      # path does — android-prepare.mjs/android-release.mjs read env FIRST, keychain second,
      # so no file with key material is ever created in the workspace.
      - name: Build the .aab and publish to Play
        if: steps.creds.outputs.ok == 'true'
        env:
          VIS_PLAY_SERVICE_ACCOUNT: ${{ secrets.VIS_PLAY_SERVICE_ACCOUNT }}
          VIS_ANDROID_KEYSTORE: ${{ secrets.VIS_ANDROID_KEYSTORE }}
          VIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VIS_ANDROID_KEYSTORE_PASSWORD }}
          VIS_ANDROID_KEY_ALIAS: ${{ secrets.VIS_ANDROID_KEY_ALIAS }}
          VIS_ANDROID_KEY_PASSWORD: ${{ secrets.VIS_ANDROID_KEY_PASSWORD }}
          VIS_ANDROID_GOOGLE_SERVICES: ${{ secrets.VIS_ANDROID_GOOGLE_SERVICES }}
        run: npm run release:android:store -- --track ${{ inputs.track || 'all' }}

      - name: Attach signed Android package to the draft
        if: inputs.require_complete && steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < ../../VIS_VERSION)
          mkdir -p build/release
          asset="build/release/vis-companion-$VERSION-android.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
      - name: No Play credentials
        if: steps.creds.outputs.ok != 'true'
        env:
          REQUIRE_COMPLETE: ${{ inputs.require_complete }}
        run: |
          if [ "$REQUIRE_COMPLETE" = true ]; then
            echo '::error::Complete release requires Android signing credentials'; exit 1
          fi
          echo '::notice::VIS_PLAY_SERVICE_ACCOUNT / VIS_ANDROID_KEYSTORE not set — skipping the Play upload'
