name: Mobile release

# Ships the Vis Companion app to both public beta channels. A regular Vis
# `vX.Y.Z` release calls this workflow only after its own release succeeds;
# app-only rebuilds arrive through the movable `companion-vX.Y.Z` tag. Both
# paths must match the repo-root VIS_VERSION exactly.
#   iOS      → TestFlight, and (with `public`) an external PUBLIC-LINK group after Beta App Review
#   Android  → Google Play; track `beta` IS the public "Open testing" channel
#
# Store build logic stays in scripts/{ios-release,android-release}.mjs. Public
# npm release commands only orchestrate the regular/companion tag contract;
# CI calls the explicit `release:ios:store` / `release:android:store` internals.
#
# Repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   iOS      VIS_ASC_KEY_ID, VIS_ASC_ISSUER_ID, VIS_ASC_KEY (the .p8 CONTENTS), VIS_IOS_TEAM_ID,
#            VIS_IOS_DISTRIBUTION_P12 (base64 .p12), VIS_IOS_DISTRIBUTION_P12_PASSWORD
#   Android  VIS_PLAY_SERVICE_ACCOUNT (service-account JSON), VIS_ANDROID_KEYSTORE (base64 .jks),
#            VIS_ANDROID_KEYSTORE_PASSWORD, VIS_ANDROID_KEY_ALIAS, VIS_ANDROID_KEY_PASSWORD,
#            VIS_ANDROID_GOOGLE_SERVICES (google-services.json, optional — push only)
# Export what you already hold locally:
#   cd apps/vis-companion && npm run secrets export-keystore | base64   # VIS_ANDROID_KEYSTORE
#
# A platform whose secrets are absent is SKIPPED, not failed: a fork, or a repo with only
# one of the two stores set up, must still get a green run.

on:
  push:
    tags: ['companion-v*']
  workflow_call:
    inputs:
      platforms:
        type: string
        default: both
      track:
        type: string
        default: beta
      public:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      platforms:
        description: Which stores to ship to
        type: choice
        options: [both, ios, android]
        default: both
      track:
        description: "Play track (beta = public open testing)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      public:
        description: "iOS: also submit for Beta App Review and link the public TestFlight group"
        type: boolean
        default: false

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/vis-companion

jobs:
  ios:
    # A tag ships to TestFlight; a manual run only when iOS was asked for.
    if: ${{ github.event_name == 'push' || inputs.platforms != 'android' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      # Version code is `git rev-list --count HEAD`, so a shallow clone would produce a
      # LOWER build number than the previous release and App Store Connect would reject it.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Verify release lineage and VIS_VERSION
        run: |
          set -euo pipefail

          VERSION=$(tr -d '[:space:]' < ../../VIS_VERSION)
          REGULAR="v$VERSION"
          REGULAR_COMMIT=$(git rev-parse --verify "$REGULAR^{commit}") || {
            echo "$REGULAR must exist before releasing its companion" >&2
            exit 1
          }

          if [ "${{ github.event_name }}" = push ]; then
            case "$GITHUB_REF_NAME" in
              v*) EXPECTED="$REGULAR" ;;
              companion-v*) EXPECTED="companion-v$VERSION" ;;
              *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
            test "$GITHUB_REF_NAME" = "$EXPECTED" || {
              echo "$GITHUB_REF_NAME does not match VIS_VERSION=$VERSION (expected $EXPECTED)" >&2
              exit 1
            }
          fi

          git merge-base --is-ancestor "$REGULAR_COMMIT" HEAD || {
            echo "$REGULAR must be an ancestor of this companion release" >&2
            exit 1
          }
          if [ "${GITHUB_REF_NAME:-}" = "$REGULAR" ]; then
            test "$REGULAR_COMMIT" = "$(git rev-parse HEAD)" || {
              echo "$REGULAR must point at the exact regular-release commit" >&2
              exit 1
            }
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/vis-companion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Have credentials?
        id: creds
        env:
          KEY: ${{ secrets.VIS_ASC_KEY }}
        run: echo "ok=${{ env.KEY != '' }}" >> "$GITHUB_OUTPUT"

      # xcodebuild and altool both insist on a FILE. Keep it in RUNNER_TEMP (wiped with the
      # runner) with 0600, never in the workspace where an artifact upload could catch it.
      - name: Materialise the App Store Connect key
        if: steps.creds.outputs.ok == 'true'
        env:
          VIS_ASC_KEY: ${{ secrets.VIS_ASC_KEY }}
        run: |
          umask 077
          printf '%s\n' "$VIS_ASC_KEY" > "$RUNNER_TEMP/AuthKey_${{ secrets.VIS_ASC_KEY_ID }}.p8"

      # App Store Connect API auth can fetch profiles, but GitHub runners have no signing
      # identity. Import our dedicated API-created distribution certificate into an ephemeral
      # keychain; the runner and every decrypted byte disappear when the job ends.
      - name: Install the iOS distribution certificate
        if: steps.creds.outputs.ok == 'true'
        env:
          P12_BASE64: ${{ secrets.VIS_IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.VIS_IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" || { echo 'VIS_IOS_DISTRIBUTION_P12 is required' >&2; exit 1; }
          test -n "$P12_PASSWORD" || { echo 'VIS_IOS_DISTRIBUTION_P12_PASSWORD is required' >&2; exit 1; }
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/vis-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vis-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build, upload, distribute
        if: steps.creds.outputs.ok == 'true'
        env:
          VIS_ASC_KEY_ID: ${{ secrets.VIS_ASC_KEY_ID }}
          VIS_ASC_ISSUER_ID: ${{ secrets.VIS_ASC_ISSUER_ID }}
          VIS_IOS_TEAM_ID: ${{ secrets.VIS_IOS_TEAM_ID }}
        run: |
          export VIS_ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${VIS_ASC_KEY_ID}.p8"
          npm run release:ios:store -- ${{ (github.event_name == 'push' || inputs.public) && '--public' || '' }}

      - name: No iOS credentials
        if: steps.creds.outputs.ok != 'true'
        run: echo '::notice::VIS_ASC_KEY is not set — skipping the TestFlight upload'

  android:
    if: ${{ github.event_name == 'push' || inputs.platforms != 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Verify release lineage and VIS_VERSION
        run: |
          set -euo pipefail

          VERSION=$(tr -d '[:space:]' < ../../VIS_VERSION)
          REGULAR="v$VERSION"
          REGULAR_COMMIT=$(git rev-parse --verify "$REGULAR^{commit}") || {
            echo "$REGULAR must exist before releasing its companion" >&2
            exit 1
          }

          if [ "${{ github.event_name }}" = push ]; then
            case "$GITHUB_REF_NAME" in
              v*) EXPECTED="$REGULAR" ;;
              companion-v*) EXPECTED="companion-v$VERSION" ;;
              *) echo "Unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
            test "$GITHUB_REF_NAME" = "$EXPECTED" || {
              echo "$GITHUB_REF_NAME does not match VIS_VERSION=$VERSION (expected $EXPECTED)" >&2
              exit 1
            }
          fi

          git merge-base --is-ancestor "$REGULAR_COMMIT" HEAD || {
            echo "$REGULAR must be an ancestor of this companion release" >&2
            exit 1
          }
          if [ "${GITHUB_REF_NAME:-}" = "$REGULAR" ]; then
            test "$REGULAR_COMMIT" = "$(git rev-parse HEAD)" || {
              echo "$REGULAR must point at the exact regular-release commit" >&2
              exit 1
            }
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/vis-companion/package-lock.json

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Have credentials?
        id: creds
        env:
          SA: ${{ secrets.VIS_PLAY_SERVICE_ACCOUNT }}
          KS: ${{ secrets.VIS_ANDROID_KEYSTORE }}
        run: echo "ok=${{ env.SA != '' && env.KS != '' }}" >> "$GITHUB_OUTPUT"

      # Every credential goes in through the environment, exactly as the local keychain
      # path does — android-prepare.mjs/android-release.mjs read env FIRST, keychain second,
      # so no file with key material is ever created in the workspace.
      - name: Build the .aab and publish to Play
        if: steps.creds.outputs.ok == 'true'
        env:
          VIS_PLAY_SERVICE_ACCOUNT: ${{ secrets.VIS_PLAY_SERVICE_ACCOUNT }}
          VIS_ANDROID_KEYSTORE: ${{ secrets.VIS_ANDROID_KEYSTORE }}
          VIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VIS_ANDROID_KEYSTORE_PASSWORD }}
          VIS_ANDROID_KEY_ALIAS: ${{ secrets.VIS_ANDROID_KEY_ALIAS }}
          VIS_ANDROID_KEY_PASSWORD: ${{ secrets.VIS_ANDROID_KEY_PASSWORD }}
          VIS_ANDROID_GOOGLE_SERVICES: ${{ secrets.VIS_ANDROID_GOOGLE_SERVICES }}
        run: npm run release:android:store -- --track ${{ inputs.track || 'beta' }}

      - name: No Play credentials
        if: steps.creds.outputs.ok != 'true'
        run: echo '::notice::VIS_PLAY_SERVICE_ACCOUNT / VIS_ANDROID_KEYSTORE not set — skipping the Play upload'
