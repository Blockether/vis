name: Publish Python SDK

# The release uses GITHUB_TOKEN, so its published release does not trigger workflows.
# Completion triggers this top-level workflow, as required by PyPI trusted publishing.
# Beta Native dispatches it for each published beta: every published build bundles
# an SDK version that is on PyPI (bin/sdk-version).
on:
  workflow_run:
    workflows: ['Release & Deploy to Clojars']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact SDK version gate (VIS_VERSION, or the dev release of a beta tag)
        type: string
        default: ''
      release_tag:
        description: Existing vX.Y.Z or beta-<sha> tag to publish (empty publishes VIS_VERSION from main)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  source:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.event.workflow_run.head_sha || github.sha }}
          # bin/sdk-version numbers a beta's SDK by commit count: full history, no trees.
          fetch-depth: 0
          filter: tree:0
      - name: Derive the SDK version that this source bundles
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            beta-*)
              [[ "$RELEASE_TAG" =~ ^beta-[0-9a-f]{40}$ ]] || {
                echo "::error::Invalid beta tag $RELEASE_TAG"; exit 1; }
              track=beta ;;
            *) track=release ;;
          esac
          if [ "$track" = release ]; then
            # A release bundles VIS_VERSION. Its tag can predate bin/sdk-version.
            version="$(tr -d '[:space:]' < VIS_VERSION)"
          else
            version="$(bin/sdk-version "$track")"
          fi
          # PyPI refuses local labels such as +dirty.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]+)?$ ]] || {
            echo "::error::SDK version $version cannot be published"; exit 1; }
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "::error::This source bundles SDK $version, not $EXPECTED_VERSION"; exit 1
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    uses: ./.github/workflows/python-packages.yml
    with:
      version: ${{ needs.source.outputs.version }}
      ref: ${{ needs.source.outputs.ref }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-sdk-distributions
          path: dist
      - name: Check whether the verified SDK is already published
        id: existing
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          wheel, = Path('dist').glob('vis_agent-*-py3-none-any.whl')
          version = wheel.name.split('-')[1]
          files = list(Path('dist').iterdir())
          if {path.name for path in files} != {wheel.name, f'vis_agent-{version}.tar.gz'}:
              raise SystemExit('Expected exactly the verified wheel and source distribution')
          expected = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          try:
              with urlopen(f'https://pypi.org/pypi/vis-agent/{version}/json', timeout=30) as response:
                  metadata = json.load(response)
          except HTTPError as error:
              if error.code != 404:
                  raise
              published = False
          else:
              existing = {item['filename']: item['digests']['sha256'] for item in metadata['urls']}
              if (metadata['info']['version'] != version or len(metadata['urls']) != len(expected)
                      or existing != expected):
                  raise SystemExit('PyPI already contains different or incomplete distributions; refusing publication')
              published = True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'published={str(published).lower()}\n')
          print('Identical verified distributions are already on PyPI' if published else 'Version is not on PyPI yet')
          PY
      - name: Publish the verified SDK (never overwrite existing versions)
        if: steps.existing.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
