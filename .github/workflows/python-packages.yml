name: Python SDK

on:
  workflow_call:
    inputs:
      ref:
        description: Source commit to build and test; defaults to the triggering commit
        default: ''
        type: string
      version:
        description: Optional exact SDK version, VIS_VERSION or a beta's dev release from bin/sdk-version
        default: ''
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Hosted macOS legs are most of this workflow's runner time. A main push whose SDK
  # inputs already passed every interpreter that UTC day keeps only the leg that lints,
  # uploads the tested wheel and feeds the engine job; every other run tests them all.
  interpreters:
    name: Select interpreters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.inputs.outputs.key }}
      exclude: ${{ steps.select.outputs.exclude }}
      record: ${{ steps.select.outputs.record }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Hash the SDK inputs
        id: inputs
        run: |
          set -euo pipefail
          # Paths that the wheel build and its installed tests read.
          tree="$(git ls-tree HEAD -- packages resources test/resources bin README.md VIS_VERSION \
            .github/workflows/python-packages.yml | git hash-object --stdin)"
          echo "key=python-sdk-verified-$(date -u +%F)-$tree" >> "$GITHUB_OUTPUT"
      - name: Look up SDK inputs that passed every interpreter
        id: verified
        uses: actions/cache/restore@v6
        with:
          path: .python-sdk-verified
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true
      - name: Select interpreters
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_REF: ${{ inputs.ref }}
          VERIFIED: ${{ steps.verified.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # Releases, publication, pull requests and manual runs test every interpreter.
          exclude='[]'
          if [[ "$EVENT" == push && "$REF" == refs/heads/main && -z "$INPUT_REF" && "$VERIFIED" == true ]]; then
            exclude='[{"os":"macos-26"},{"python":"3.12"},{"python":"3.13"},{"python":"3.14"},{"python":"pypy3.11"}]'
          fi
          record=false
          if [[ "$REF" == refs/heads/main && "$VERIFIED" != true ]]; then
            record=true
          fi
          echo "exclude=$exclude" >> "$GITHUB_OUTPUT"
          echo "record=$record" >> "$GITHUB_OUTPUT"

  distribution:
    needs: interpreters
    name: ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        python: ['3.11', '3.12', '3.13', '3.14', 'pypy3.11']
        exclude: ${{ fromJSON(needs.interpreters.outputs.exclude) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and test tools
        run: python -m pip install build twine pytest ruff pyright==1.1.408
      # Source lint is interpreter-independent; installed tests still run on every matrix leg.
      - name: Lint and format
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python -m ruff check packages
          python -m ruff format --check packages
      # A beta publishes its commit's dev release; a release keeps the VIS_VERSION mirror.
      - name: Set the development release version
        if: contains(inputs.version, '.dev')
        env:
          SDK_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          pyproject = Path('packages/vis-agent/pyproject.toml')
          text, count = re.subn(r'(?m)^version = "[^"]*"$', f'version = "{os.environ["SDK_VERSION"]}"',
                                pyproject.read_text())
          assert count == 1, 'pyproject.toml needs exactly one version line'
          pyproject.write_text(text)
          PY
      - name: Build wheels from sdists
        run: |
          python -m build packages/vis-agent --outdir dist
          python -m twine check --strict dist/*
      - name: Verify versions and installed distributions outside the checkout
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib.metadata as metadata
          import os
          import re
          from pathlib import Path
          import blockether.vis.extension as vis
          from blockether.vis.engine import GatewayClient, LocalEngine
          from blockether.vis import _contracts
          version = (Path(os.environ['GITHUB_WORKSPACE']) / 'VIS_VERSION').read_text().strip()
          expected = os.environ.get('EXPECTED_VERSION') or version
          # bin/sdk-version: a beta follows VIS_VERSION X.Y.Z with X.Y.(Z+1).devN.
          major, minor, patch = map(int, version.split('.'))
          assert expected == version or re.fullmatch(rf'{major}\.{minor}\.{patch + 1}\.dev[0-9]+', expected), expected
          assert metadata.version('vis-agent') == expected
          assert not str(Path(vis.__file__).resolve()).startswith(os.environ['GITHUB_WORKSPACE'])
          assert _contracts.schema('gateway')['$defs']['handshake']['required']
          PY
          VIS_TEST_INSTALLED=1 python -m pytest "$GITHUB_WORKSPACE/packages/vis-agent/tests" -q
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: python-sdk-distributions
          path: dist/*
          if-no-files-found: error

  # Release recovery requires every job of the release run to pass, so this job runs
  # whenever the full matrix ran; only its steps depend on the missing marker.
  record:
    needs: [interpreters, distribution]
    if: needs.interpreters.outputs.exclude == '[]'
    name: Record verified SDK inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the verification marker
        if: needs.interpreters.outputs.record == 'true'
        env:
          KEY: ${{ needs.interpreters.outputs.key }}
        run: printf '%s\n' "$KEY" > .python-sdk-verified
      - uses: actions/cache/save@v6
        if: needs.interpreters.outputs.record == 'true'
        with:
          path: .python-sdk-verified
          key: ${{ needs.interpreters.outputs.key }}

  engine:
    needs: distribution
    name: real SDK engine / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps.edn', 'apps/**/deps.edn', 'packages/**/deps.edn') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: python-sdk-distributions
          path: dist
      - name: Install tested wheels
        run: python -m pip install pytest dist/*.whl
      - name: Exercise real HTTP and stdio engines with an isolated model double
        run: |
          clojure -X:deps prep
          python - <<'PY'
          import os, shlex, subprocess
          from pathlib import Path
          root = Path.cwd()
          cp = subprocess.check_output(['clojure', '-Spath', '-A:vis'], text=True).strip()
          cp = os.pathsep.join(str((root / entry).resolve()) for entry in cp.split(os.pathsep))
          env = {**os.environ, 'VIS_TEST_INSTALLED': '1', 'VIS_TEST_LOCAL_COMMAND': shlex.join([
              'java', '--enable-native-access=ALL-UNNAMED', '--enable-preview', '-Xmx2g',
              '-cp', cp, 'clojure.main', '-m', 'com.blockether.vis.core'])}
          subprocess.run(['python', '-m', 'pytest', str(root / 'packages/vis-agent/tests/test_engine.py'),
                          str(root / 'packages/vis-agent/tests/test_local.py'), '-q'],
                         cwd=os.environ['RUNNER_TEMP'], env=env, check=True)
          PY
