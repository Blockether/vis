name: Desktop companion

# Packages Vis Companion for universal macOS and Linux x64/ARM64
# with Pake — the same web bundle the phones get, wrapped in a Tauri window
# (see apps/vis-companion/scripts/desktop-package.mjs for the flags and asset names).
# A regular release attaches all installers to an unpublished draft. Only the
# complete-product gate publishes it. Branch dispatches build without publishing;
# dispatched tag recovery may update a draft, never an already published version.
# Windows desktop CI is disabled until platform support is available.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the installers to (defaults to the calling ref)"
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach to; leave empty for a dry run on this ref"
        type: string
        required: false

permissions:
  contents: write          # upload assets to the release
  # id-token: write        # Azure workload identity; no long-lived signing secret

concurrency:
  group: desktop-companion-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    environment: desktop-build
    # environment: ${{ matrix.asset == 'windows-x64' && 'windows-signing' || 'desktop-build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, macOS, ARM64, vis-macos-arm64]
            label: macOS universal
            asset: macos-universal
          - runner: ubuntu-24.04
            label: Linux x64
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            label: Linux ARM64
            asset: linux-arm64
          # - runner: windows-2022
          #   label: Windows x64
          #   asset: windows-x64
    defaults:
      run:
        working-directory: apps/vis-companion
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Decide where this build lands
        id: target
        run: |
          ref='${{ inputs.tag || github.ref_name }}'
          case "$ref" in
            v[0-9]*) echo 'publish=true' >> "$GITHUB_OUTPUT"; echo "attaching to $ref" ;;
            *) echo 'publish=false' >> "$GITHUB_OUTPUT"; echo "dry run on $ref: packaging, publishing nothing" ;;
          esac

      - uses: ./.github/actions/require-draft-release
        if: steps.target.outputs.publish == 'true'
        with:
          tag: ${{ inputs.tag || github.ref_name }}
      # RUNNER_TEMP is cleaned between jobs; never upload the persistent npm cache.
      - name: Use job-local npm cache
        run: echo "npm_config_cache=$RUNNER_TEMP/vis-npm-cache" >> "$GITHUB_ENV"

      # Checkout cleans the workspace, so a target directory inside it starts empty
      # on every attempt and a Pake build that hit its own 15-minute command timeout
      # can never resume. Keep the Cargo target outside the checkout: on a reusable
      # runner the next attempt continues the compile instead of restarting it.
      - name: Keep the Cargo target out of the cleaned workspace
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/vis/desktop-target" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pake builds one macOS binary for both Apple silicon and Intel.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Identify the Rust compiler cache
        id: rust-cache
        run: echo "compiler=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          # This is the actual CARGO_TARGET_DIR used by desktop-package.mjs,
          # not a repository target directory that Pake never writes.
          path: |
            ~/.cache/vis/desktop-target
            ~/.cargo/registry
            ~/.cargo/git
          key: pake-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.compiler }}-3.15.7-${{ hashFiles('apps/vis-companion/package-lock.json', 'apps/vis-companion/scripts/desktop-package.mjs') }}
          restore-keys: pake-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache.outputs.compiler }}-3.15.7-

      - name: Install Linux WebKit build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev build-essential file xdg-utils

      - name: Install dependencies
        run: npm ci

      - name: Test desktop packaging
        run: npm exec vitest -- run scripts/desktop-package.test.mjs scripts/version.test.mjs

      - name: Build web bundle
        run: npm run build

      - name: Package Linux with Pake
        if: runner.os == 'Linux'
        run: npm run package:desktop

      # - name: Log in to Azure with GitHub OIDC
      #   if: runner.os == 'Windows'
      #   uses: azure/login@v3
      #   with:
      #     client-id: ${{ vars.WINDOWS_SIGNING_CLIENT_ID }}
      #     tenant-id: ${{ vars.WINDOWS_SIGNING_TENANT_ID }}
      #     subscription-id: ${{ vars.WINDOWS_SIGNING_SUBSCRIPTION_ID }}

      # - name: Sign and package Windows with Pake
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   env:
      #     WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      #     WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      #     WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
      #     WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
      #   run: |
      #     $ErrorActionPreference = 'Stop'
      #     # Same pinned module used by azure/artifact-signing-action@v2.
      #     Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Force -Repository PSGallery
      #     pwsh -NoProfile -NonInteractive -File ./scripts/windows-sign.test.ps1
      #     if ($LASTEXITCODE -ne 0) { throw 'Windows signature verification tests failed' }
      #     npm run package:desktop
      #     if ($LASTEXITCODE -ne 0) { throw 'Signed Windows packaging failed' }

      # Isolate CI signing from locked or duplicate identities in the login keychain.
      - name: Sign and notarize macOS with Pake
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.VIS_DESKTOP_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.VIS_DESKTOP_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: BLOCKETHER SP. Z O.O. (JSZTFUBUBB)'
          APPLE_API_KEY: ${{ secrets.VIS_ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.VIS_ASC_ISSUER_ID }}
          VIS_ASC_KEY: ${{ secrets.VIS_ASC_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER VIS_ASC_KEY; do
            test -n "${!name}" || { echo "Missing required signing credential: $name" >&2; exit 1; }
          done
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/vis-desktop-signing.XXXXXX")"
          keychain="$signing_dir/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          original_keychains=()
          while IFS= read -r line; do
            line="${line#*\"}"
            original_keychains+=("${line%\"*}")
          done < <(security list-keychains -d user)
          cleanup() {
            security list-keychains -d user -s "${original_keychains[@]}"
            security delete-keychain "$keychain" || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT
          export APPLE_API_KEY_PATH="$signing_dir/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$VIS_ASC_KEY" > "$APPLE_API_KEY_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$signing_dir/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign also needs Apple's intermediate certificates to build its trust chain.
          for certificate in DeveloperIDCA DeveloperIDG2CA; do
            curl --fail --silent --show-error --location "https://www.apple.com/certificateauthority/$certificate.cer" -o "$signing_dir/$certificate.cer"
            security import "$signing_dir/$certificate.cer" -k "$keychain" > /dev/null
          done
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"
          security find-identity -v -p codesigning "$keychain"
          # Fail before compilation if noninteractive signing is unavailable.
          cp /usr/bin/true "$signing_dir/signing-probe"
          codesign --force --timestamp --options runtime --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$signing_dir/signing-probe"
          codesign --verify --strict "$signing_dir/signing-probe"
          # Use the prepared keychain, not Tauri's second certificate import.
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD VIS_ASC_KEY
          npm run package:desktop

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mount="$(mktemp -d "$RUNNER_TEMP/vis-desktop-mount.XXXXXX")"
          trap 'hdiutil detach "$mount"; rmdir "$mount"' EXIT
          images=(build/desktop/*-macos-universal.dmg)
          test "${#images[@]}" -eq 1
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          codesign --verify --deep --strict --verbose=2 "$mount/Vis.app"
          codesign --verify -R='anchor apple generic and certificate leaf[subject.OU] = "JSZTFUBUBB" and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$mount/Vis.app"
          xcrun stapler validate "$mount/Vis.app"
          spctl --assess --type execute --verbose=2 "$mount/Vis.app"

      # Exercise the actual MSI and WebView2 host, not just the packaging helpers.
      # - name: Smoke-test Windows installer
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   env:
      #     WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}
      #   run: |
      #     $ErrorActionPreference = 'Stop'
      #     $installers = @(Get-ChildItem build/desktop/*-windows-x64.msi)
      #     if ($installers.Count -ne 1) { throw 'Expected exactly one Windows MSI' }
      #     ./scripts/windows-sign.ps1 -FilePath $installers[0].FullName -VerifyOnly
      #     $destination = Join-Path $env:RUNNER_TEMP 'vis-windows-smoke'
      #     $arguments = "/a `"$($installers[0].FullName)`" /qn TARGETDIR=`"$destination`""
      #     $install = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
      #     if ($install.ExitCode -ne 0) { throw "MSI extraction failed: $($install.ExitCode)" }
      #     $executables = @(Get-ChildItem $destination -Recurse -Filter 'pake-vis.exe')
      #     if ($executables.Count -ne 1) { throw 'Expected the packaged Vis executable' }
      #     ./scripts/windows-sign.ps1 -FilePath $executables[0].FullName -VerifyOnly
      #     $app = Start-Process $executables[0].FullName -PassThru
      #     try {
      #       $ready = $false
      #       foreach ($attempt in 1..30) {
      #         Start-Sleep -Seconds 1
      #         $app.Refresh()
      #         if ($app.HasExited) { throw "Vis exited before opening its window: $($app.ExitCode)" }
      #         if ($app.MainWindowHandle -ne 0 -and $app.Responding) { $ready = $true; break }
      #       }
      #       if (-not $ready) { throw 'Vis did not open a responsive window within 30 seconds' }
      #       Write-Output 'Windows MSI extracted and Vis opened a responsive window.'
      #     } finally {
      #       if (-not $app.HasExited) { $app | Stop-Process -Force }
      #     }

      - name: List installers
        run: ls -la build/desktop

      - name: Keep installers as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vis-companion-desktop-${{ matrix.asset }}
          path: apps/vis-companion/build/desktop/*
          if-no-files-found: error

      - name: Attach to release
        if: steps.target.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            apps/vis-companion/build/desktop/*
