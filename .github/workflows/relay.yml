name: Relay

# Deploy only when the relay, its HTTPS deployment helper or this workflow changes.
on:
  push:
    branches: [main]
    paths:
      - "apps/vis-companion-relay/**"
      - "scripts/cloudflare-https*.mjs"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "apps/vis-companion-relay/**"
      - "scripts/cloudflare-https*.mjs"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

# Nothing here reads or writes the repository: the deploy credential is the
# Cloudflare token, and it is an environment secret that only `main` can reach.
permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/vis-companion-relay

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      # `npm ci` runs third-party install scripts in the same job as the
      # Cloudflare token; do not also hand them a git credential.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vis-companion-relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The suite drives the real router against a fake provider fetch and fake
      # rate limiters: no network, no Cloudflare account, same gate as local.
      - run: npm test
      - run: node --test ../../scripts/cloudflare-https.test.mjs

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vis-companion-relay/package-lock.json
      - run: npm ci

      # A fork, or an account nobody has wired up yet, stands down instead of
      # failing: a permanent red X teaches everyone to ignore this workflow.
      - name: Is a Cloudflare account configured?
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "is_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set - skipping deploy."
          fi

      # Public configuration only. RELAY_SEAL_KEY, APNS_KEY_P8 and
      # FCM_SERVICE_ACCOUNT are `wrangler secret put` once and live only in
      # Cloudflare -- `wrangler deploy` never touches a Worker's secrets, so no
      # key material is ever visible to CI, and there is no database, schema, or
      # migration for this step to keep in sync either.
      - name: Deploy
        if: steps.guard.outputs.is_configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --var "APNS_KEY_ID:${{ vars.APNS_KEY_ID }}" \
            --var "APNS_TEAM_ID:${{ vars.APNS_TEAM_ID }}" \
            --var "APNS_TOPIC:${{ vars.APNS_TOPIC }}" \
            --var "APNS_DEFAULT_ENV:${{ vars.APNS_DEFAULT_ENV || 'production' }}" \
            --var "GRANT_TTL_DAYS:${{ vars.GRANT_TTL_DAYS || '90' }}"

      - name: Require HTTPS on the production Custom Domain
        if: steps.guard.outputs.is_configured == 'true' && vars.RELAY_HEALTHCHECK_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HTTPS_URL: ${{ vars.RELAY_HEALTHCHECK_URL }}
          WORKER_NAME: vis-companion-relay
        run: node ../../scripts/cloudflare-https.mjs configure

      # Upload exiting 0 is not delivery. Ask the deployed Worker whether it can
      # sign for a provider at all; `is_accepting_grants` false means the seal
      # key never made it into the account.
      - name: Smoke test the deployment
        if: steps.guard.outputs.is_configured == 'true' && vars.RELAY_HEALTHCHECK_URL != ''
        env:
          HTTPS_URL: ${{ vars.RELAY_HEALTHCHECK_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node ../../scripts/cloudflare-https.mjs verify &&
              curl -sS --fail --max-time 10 "$HTTPS_URL" -o /tmp/healthz.json &&
              node -e '
                try {
                  const health = JSON.parse(require("node:fs").readFileSync("/tmp/healthz.json", "utf8"));
                  if (!health.is_ok || !health.is_accepting_grants ||
                      (!health.apns.is_available && !health.fcm.is_available)) process.exit(1);
                } catch { process.exit(1); }
              '; then
              echo "HTTPS redirects and relay health verified"
              exit 0
            fi
            echo "HTTPS redirect or healthz attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::error::the deployed relay failed HTTPS redirect or health verification"
          exit 1
