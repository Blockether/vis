name: Relay

# Deploy when the relay, its canonical contracts or deployment helpers change.
on:
  push:
    branches: [main]
    paths:
      - "apps/vis-companion-relay/**"
      - "packages/vis-contract/resources/vis-contract/schema/**"
      - "scripts/cloudflare-https*.mjs"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "apps/vis-companion-relay/**"
      - "packages/vis-contract/resources/vis-contract/schema/**"
      - "scripts/cloudflare-https*.mjs"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

# Nothing here reads or writes the repository: the deploy credential is the
# Cloudflare token, and it is an environment secret that only `main` can reach.
permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/vis-companion-relay

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      # `npm ci` runs third-party install scripts in the same job as the
      # Cloudflare token; do not also hand them a git credential.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vis-companion-relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      # Rooms uses real workerd and D1. Provider calls and rate limits stay local.
      - run: npm test
      - run: node --test ../../scripts/cloudflare-https.test.mjs

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vis-companion-relay/package-lock.json
      - run: npm ci

      # A fork, or an account nobody has wired up yet, stands down instead of
      # failing: a permanent red X teaches everyone to ignore this workflow.
      - name: Is a Cloudflare account configured?
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "is_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set - skipping deploy."
          fi

      # Keep database IDs in the relay environment, not the public checkout.
      # Apply additive migrations before uploading code that needs them.
      - name: Configure Rooms storage
        if: steps.guard.outputs.is_configured == 'true'
        env:
          ROOMS_DATABASE_ID: ${{ vars.ROOMS_DATABASE_ID }}
          ROOMS_DATABASE_NAME: ${{ vars.ROOMS_DATABASE_NAME || 'vis-council-rooms' }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APNS_TOPIC: ${{ vars.APNS_TOPIC }}
          APNS_DEFAULT_ENV: ${{ vars.APNS_DEFAULT_ENV }}
          GRANT_TTL_DAYS: ${{ vars.GRANT_TTL_DAYS }}
        run: node scripts/prepare-deploy.mjs "$RUNNER_TEMP/relay.wrangler.json"

      - name: Migrate Rooms storage
        if: steps.guard.outputs.is_configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ROOMS_DB --remote --config "$RUNNER_TEMP/relay.wrangler.json"

      # Worker secrets, including ROOMS_ADMIN_TOKEN, remain in Cloudflare.
      - name: Deploy
        if: steps.guard.outputs.is_configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config "$RUNNER_TEMP/relay.wrangler.json"

      - name: Require HTTPS on the production Custom Domain
        if: steps.guard.outputs.is_configured == 'true' && vars.RELAY_HEALTHCHECK_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HTTPS_URL: ${{ vars.RELAY_HEALTHCHECK_URL }}
          WORKER_NAME: vis-companion-relay
        run: node ../../scripts/cloudflare-https.mjs configure

      # Upload exiting 0 is not delivery. Ask the deployed Worker whether it can
      # sign for a provider at all; `is_accepting_grants` false means the seal
      # key never made it into the account.
      - name: Smoke test the deployment
        if: steps.guard.outputs.is_configured == 'true' && vars.RELAY_HEALTHCHECK_URL != ''
        env:
          HTTPS_URL: ${{ vars.RELAY_HEALTHCHECK_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node ../../scripts/cloudflare-https.mjs verify &&
              curl -sS --fail --max-time 10 "$HTTPS_URL" -o /tmp/healthz.json &&
              node -e '
                try {
                  const health = JSON.parse(require("node:fs").readFileSync("/tmp/healthz.json", "utf8"));
                  if (!health.is_ok || !health.is_accepting_grants ||
                      (!health.apns.is_available && !health.fcm.is_available)) process.exit(1);
                } catch { process.exit(1); }
              '; then
              echo "HTTPS redirects and relay health verified"
              exit 0
            fi
            echo "HTTPS redirect or healthz attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::error::the deployed relay failed HTTPS redirect or health verification"
          exit 1
