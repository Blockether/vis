# Published Python reader for the canonical Vis JSON documents.
# `version` mirrors the repo-root `VIS_VERSION`.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vis-contract"
version = "0.1.41"
description = "The Vis contract — View, gateway, and host semantics as portable data."
readme = "python/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["python/LICENSE"]
authors = [{ name = "Blockether" }]
keywords = ["vis", "agent", "extension", "contract", "protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Blockether/vis"
Source = "https://github.com/Blockether/vis"
Issues = "https://github.com/Blockether/vis/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/src/vis_contract"]

[tool.hatch.build.targets.wheel.force-include]
"resources/vis-contract" = "vis_contract/data"

[tool.hatch.build.targets.sdist]
include = [
  "resources/vis-contract",
  "python/src/vis_contract",
  "python/tests",
  "python/README.md",
  "python/LICENSE",
]
