# Published Python reader for the validated Vis JSON contract.
# `src/vis_contract/contract.json` is generated and pinned byte-for-byte to the
# repository aggregate. `version` mirrors the repo-root `VIS_VERSION`.
# The reader intentionally has no runtime dependencies.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vis-contract"
version = "0.1.41"
description = "The Vis contract — View, gateway, and host semantics as portable data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Blockether" }]
keywords = ["vis", "agent", "extension", "contract", "protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Blockether/vis"
Source = "https://github.com/Blockether/vis"
Issues = "https://github.com/Blockether/vis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vis_contract"]

[tool.hatch.build.targets.sdist]
include = ["src/vis_contract", "tests", "README.md", "LICENSE"]
