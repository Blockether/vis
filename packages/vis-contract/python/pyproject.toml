# The DECLARATION half of Vis: published as `vis-contract`, imported as `vis_contract`.
#
# `src/vis_contract/contract.json` is never written by hand. The owning EDN files
# under `resources/vis-contract/` are rendered by the argument-free
# `contract.python-host/write-package-document!`. `python_package_test` pins it
# byte-for-byte to the language-neutral root copy and fails when either drifts.
#
# `version` mirrors the repo-root `VIS_VERSION`, the one version source
# (`build.clj`), and `vis-agent` depends on exactly this version: the API and the
# declaration it was cut against always install as a pair.
#
# No dependencies, and none are welcome — a declaration everyone reads must be
# cheap to install. `requires-python` is the CPython level vis' own GraalPy
# implements, because the module this contract describes is a file that engine execs.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vis-contract"
version = "0.1.41"
description = "The Vis contract — View, gateway, and host semantics as portable data."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Blockether" }]
keywords = ["vis", "agent", "extension", "contract", "protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Blockether/vis"
Source = "https://github.com/Blockether/vis"
Issues = "https://github.com/Blockether/vis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vis_contract"]

[tool.hatch.build.targets.sdist]
include = ["src/vis_contract", "tests", "README.md", "LICENSE"]
