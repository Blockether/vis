# Published as `vis-agent`: extension authoring and engine clients in one SDK.
# The engine executes `src/blockether/vis/extension.py`; the wheel bundles the
# canonical JSON resources. `version` mirrors the repo-root `VIS_VERSION`.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vis-agent"
version = "0.1.45"
description = "The Vis Python SDK — author extensions and control local or remote engines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5"]
authors = [{ name = "Blockether" }]
keywords = ["vis", "agent", "extension", "automation", "human-in-the-loop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Blockether/vis"
Source = "https://github.com/Blockether/vis"
Issues = "https://github.com/Blockether/vis/issues"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blockether"]

[tool.hatch.build.targets.sdist]
include = ["src/blockether", "tests", "hatch_build.py", "README.md", "LICENSE"]
