# Published as `vis-agent`: extension authoring and engine clients in one SDK.
# The engine executes `src/blockether/vis/extension.py`; the wheel bundles the
# canonical JSON resources. `version` mirrors the repo-root `VIS_VERSION`.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vis-agent"
version = "0.3.2"
description = "The Vis Python SDK — author extensions and control local or remote engines."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Harbor runs the tasks of `blockether.vis.evals`: the agent, host environment, check and judge.
# Keep LiteLLM at this exact version: some corporate Artifactory mirrors serve only this build.
# Harbor accepts it (`litellm>=1.92.0`).
dependencies = [
  "harbor==0.24.0",
  "jsonschema>=4.23,<5",
  "litellm==1.103.1",
  "packaging>=24",
  "pydantic==2.14.1",
  "referencing>=0.28.4",
]
authors = [{ name = "Blockether" }]
keywords = ["vis", "agent", "extension", "automation", "human-in-the-loop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
docs = ["pdoc==16.0.0"]

[project.urls]
Homepage = "https://vis.blockether.com"
Documentation = "https://vis.blockether.com"
Source = "https://github.com/Blockether/vis"
Issues = "https://github.com/Blockether/vis/issues"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blockether"]

[tool.hatch.build.targets.sdist]
include = ["src/blockether", "tests", "hatch_build.py", "README.md", "LICENSE"]
