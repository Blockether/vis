# Published as `vis-agent`, imported as `vis`. The engine executes the same
# `src/vis/__init__.py` that the wheel ships. `vis-contract` supplies the canonical
# JSON declarations, and `version` mirrors the repo-root `VIS_VERSION`.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vis-agent"
version = "0.1.41"
description = "The Vis extension API — write a Vis extension in Python, and run it with or without Vis."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["vis-contract==0.1.41"]
authors = [{ name = "Blockether" }]
keywords = ["vis", "agent", "extension", "automation", "human-in-the-loop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Blockether/vis"
Source = "https://github.com/Blockether/vis"
Issues = "https://github.com/Blockether/vis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vis"]

[tool.hatch.build.targets.sdist]
include = ["src/vis", "tests", "README.md", "LICENSE"]
